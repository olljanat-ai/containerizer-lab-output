# Component vanarsdel-backoffice, from the shared chart charts/containerizer-app (values below override its values.yaml)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vanarsdel-backoffice
  labels:
    app.kubernetes.io/name: vanarsdel-backoffice
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/containerizer-app
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: containerization-challenge-retail-backoffice
  serviceAccountName: containerization-challenge-retail-backoffice-reconciler
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: localhost:5000/sandbox/containerization-challenge-retail-backoffice/vanarsdel-backoffice
      tag: 1.20261107.200 # {"$imagepolicy": "containerization-challenge-retail-backoffice:vanarsdel-backoffice:tag"}
    env:
    - name: ConnectionStrings__DefaultConnection
      valueFrom:
        secretKeyRef:
          name: lab-rabbitmq
          key: connection-string
    - name: ASPNETCORE_ENVIRONMENT
      value: Production
    - name: ASPNETCORE_HTTP_PORTS
      value: '8080'
    - name: ASPNETCORE_URLS
      value: http://+:8080
    - name: DOTNET_ENVIRONMENT
      value: Production
    - name: DataProtection__KeysFolder
      value: /data/vanarsdel/keys/backoffice
    - name: Serilog__WriteTo__0__Name
      value: Console
    - name: Oidc__Providers__0__ClientSecret
      valueFrom:
        secretKeyRef:
          name: vanarsdel-backoffice-secrets
          key: Oidc__Providers__0__ClientSecret
          optional: true
    - name: Oidc__Providers__1__ClientSecret
      valueFrom:
        secretKeyRef:
          name: vanarsdel-backoffice-secrets
          key: Oidc__Providers__1__ClientSecret
          optional: true
    - name: Serilog__WriteTo__1__Args__apiKey
      valueFrom:
        secretKeyRef:
          name: vanarsdel-backoffice-secrets
          key: Serilog__WriteTo__1__Args__apiKey
          optional: true
    - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
      value: 'true'
    - name: Oidc__Providers__0__Authority
      value: https://containerizer-idp.sandbox.lab/oauth2/token
    - name: Oidc__Providers__0__ClientId
      value: containerization-challenge-retail-backoffice--vanarsdel-backoffice
    port: 8080
    probe:
      type: httpGet
      path: /health/live
    volumes:
    - name: w0-backoffice
      mountPath: /data/vanarsdel/keys/backoffice
      emptyDir:
        sizeLimit: 256Mi
    - name: w1-tmp
      mountPath: /tmp
      emptyDir:
        sizeLimit: 256Mi
    ingress:
      enabled: true
      host: vanarsdel-backoffice-containerization-challenge-retail-ff631ec3.sandbox.lab
    networkPolicy:
      annotations:
        containerizer.io/egress: sql-server,redis,rabbitmq,azure-service-bus,seq,http-apis,configured-ports,lab-sqlserver,lab-rabbitmq
      egress:
        publicPorts:
        - port: 1433
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 6380
          protocol: TCP
        - port: 5671
          protocol: TCP
        - port: 5672
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 5341
          protocol: TCP
        - port: 80
          protocol: TCP
        - port: 5001
          protocol: TCP
        extra:
        - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
          ports:
          - port: 8443
            protocol: TCP
        lab:
        - service: sqlserver
          port: 1433
        - service: rabbitmq
          port: 5672
    externalSecrets:
    - name: secrets
      keys:
      - Oidc__Providers__0__ClientSecret
      - Oidc__Providers__1__ClientSecret
      - Serilog__WriteTo__1__Args__apiKey
