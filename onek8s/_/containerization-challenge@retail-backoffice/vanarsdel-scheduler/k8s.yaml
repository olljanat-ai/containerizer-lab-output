apiVersion: v1
kind: ServiceAccount
metadata:
  name: vanarsdel-scheduler
  labels:
    app.kubernetes.io/name: vanarsdel-scheduler
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanarsdel-scheduler
  labels:
    app.kubernetes.io/name: vanarsdel-scheduler
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: vanarsdel-scheduler
      app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vanarsdel-scheduler
        app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1654
        runAsGroup: 1654
      automountServiceAccountToken: false
      containers:
      - name: vanarsdel-scheduler
        image: localhost:5000/sandbox/containerization-challenge-retail-backoffice/vanarsdel-scheduler:1.20261114.200
        imagePullPolicy: IfNotPresent
        env:
        - name: ConnectionStrings__Quartz
          valueFrom:
            secretKeyRef:
              name: lab-sqlserver
              key: connection-string
        - name: DOTNET_ENVIRONMENT
          value: Production
        - name: Serilog__WriteTo__0__Name
          value: Console
        - name: Serilog__WriteTo__1__Args__apiKey
          valueFrom:
            secretKeyRef:
              name: vanarsdel-scheduler-secrets
              key: Serilog__WriteTo__1__Args__apiKey
              optional: true
        - name: ServiceIdentity__ClientSecret
          valueFrom:
            secretKeyRef:
              name: vanarsdel-scheduler-secrets
              key: ServiceIdentity__ClientSecret
              optional: true
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          privileged: false
          seccompProfile:
            type: RuntimeDefault
          appArmorProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            memory: 512Mi
            ephemeral-storage: 1Gi
        volumeMounts:
        - name: w0-tmp
          mountPath: /tmp
      volumes:
      - name: w0-tmp
        emptyDir:
          sizeLimit: 256Mi
      enableServiceLinks: false
      serviceAccountName: vanarsdel-scheduler
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vanarsdel-scheduler
  labels:
    app.kubernetes.io/name: vanarsdel-scheduler
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
  annotations:
    containerizer.io/egress: sql-server,redis,rabbitmq,azure-service-bus,seq,http-apis,configured-ports,lab-sqlserver,lab-rabbitmq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vanarsdel-scheduler
      app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
        - 169.254.170.2/32
        - 100.100.100.200/32
    - ipBlock:
        cidr: ::/0
        except:
        - fd00:ec2::254/128
    - namespaceSelector: {}
    ports:
    - port: 1433
      protocol: TCP
    - port: 6379
      protocol: TCP
    - port: 6380
      protocol: TCP
    - port: 5671
      protocol: TCP
    - port: 5672
      protocol: TCP
    - port: 443
      protocol: TCP
    - port: 5341
      protocol: TCP
    - port: 80
      protocol: TCP
    - port: 5001
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: containerizer-lab
      podSelector:
        matchLabels:
          containerizer.io/lab-service: sqlserver
    ports:
    - port: 1433
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: containerizer-lab
      podSelector:
        matchLabels:
          containerizer.io/lab-service: rabbitmq
    ports:
    - port: 5672
      protocol: TCP
---
# values come from the secret store (ClusterSecretStore app-secrets, remote key containerization-challenge-retail-backoffice--vanarsdel-scheduler); never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vanarsdel-scheduler-secrets
  labels:
    app.kubernetes.io/name: vanarsdel-scheduler
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: vanarsdel-scheduler-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: ConnectionStrings__Quartz
    remoteRef:
      key: containerization-challenge-retail-backoffice--vanarsdel-scheduler
      property: ConnectionStrings__Quartz
  - secretKey: Serilog__WriteTo__1__Args__apiKey
    remoteRef:
      key: containerization-challenge-retail-backoffice--vanarsdel-scheduler
      property: Serilog__WriteTo__1__Args__apiKey
  - secretKey: ServiceIdentity__ClientSecret
    remoteRef:
      key: containerization-challenge-retail-backoffice--vanarsdel-scheduler
      property: ServiceIdentity__ClientSecret
