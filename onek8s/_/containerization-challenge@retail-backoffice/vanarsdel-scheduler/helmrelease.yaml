# Component vanarsdel-scheduler, from the shared chart charts/containerizer-app (values below override its values.yaml)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vanarsdel-scheduler
  labels:
    app.kubernetes.io/name: vanarsdel-scheduler
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/containerizer-app
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: containerization-challenge-retail-backoffice
  serviceAccountName: containerization-challenge-retail-backoffice-reconciler
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: localhost:5000/sandbox/containerization-challenge-retail-backoffice/vanarsdel-scheduler
      tag: 1.20261107.200 # {"$imagepolicy": "containerization-challenge-retail-backoffice:vanarsdel-scheduler:tag"}
    env:
    - name: ConnectionStrings__Quartz
      valueFrom:
        secretKeyRef:
          name: lab-sqlserver
          key: connection-string
    - name: DOTNET_ENVIRONMENT
      value: Production
    - name: Serilog__WriteTo__0__Name
      value: Console
    - name: Serilog__WriteTo__1__Args__apiKey
      valueFrom:
        secretKeyRef:
          name: vanarsdel-scheduler-secrets
          key: Serilog__WriteTo__1__Args__apiKey
          optional: true
    - name: ServiceIdentity__ClientSecret
      valueFrom:
        secretKeyRef:
          name: vanarsdel-scheduler-secrets
          key: ServiceIdentity__ClientSecret
          optional: true
    volumes:
    - name: w0-tmp
      mountPath: /tmp
      emptyDir:
        sizeLimit: 256Mi
    networkPolicy:
      annotations:
        containerizer.io/egress: sql-server,redis,rabbitmq,azure-service-bus,seq,http-apis,configured-ports,lab-sqlserver,lab-rabbitmq
      egress:
        publicPorts:
        - port: 1433
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 6380
          protocol: TCP
        - port: 5671
          protocol: TCP
        - port: 5672
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 5341
          protocol: TCP
        - port: 80
          protocol: TCP
        - port: 5001
          protocol: TCP
        lab:
        - service: sqlserver
          port: 1433
        - service: rabbitmq
          port: 5672
    externalSecrets:
    - name: secrets
      keys:
      - ConnectionStrings__Quartz
      - Serilog__WriteTo__1__Args__apiKey
      - ServiceIdentity__ClientSecret
