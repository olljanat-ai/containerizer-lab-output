apiVersion: v1
kind: ServiceAccount
metadata:
  name: vanarsdel-inventory-api
  labels:
    app.kubernetes.io/name: vanarsdel-inventory-api
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanarsdel-inventory-api
  labels:
    app.kubernetes.io/name: vanarsdel-inventory-api
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: vanarsdel-inventory-api
      app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vanarsdel-inventory-api
        app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1654
        runAsGroup: 1654
      automountServiceAccountToken: false
      containers:
      - name: vanarsdel-inventory-api
        image: localhost:5000/sandbox/containerization-challenge-retail-backoffice/vanarsdel-inventory-api:1.20261105.2119
        imagePullPolicy: IfNotPresent
        env:
        - name: ConnectionStrings__Inventory
          valueFrom:
            secretKeyRef:
              name: lab-sqlserver
              key: connection-string
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: ASPNETCORE_HTTP_PORTS
          value: '8080'
        - name: ASPNETCORE_URLS
          value: http://+:8080
        - name: DOTNET_ENVIRONMENT
          value: Production
        - name: Kestrel__Endpoints__Grpc__Url
          value: http://+:8080
        - name: Kestrel__Endpoints__Http__Url
          value: http://+:8081
        - name: Kestrel__Endpoints__Https__Certificate__Path
          value: /secrets/inventory.corp.local.pfx
        - name: Kestrel__Endpoints__Https__Url
          value: http://+:8082
        - name: Serilog__WriteTo__0__Name
          value: Console
        - name: Kestrel__Endpoints__Https__Certificate__Password
          valueFrom:
            secretKeyRef:
              name: vanarsdel-inventory-api-secrets
              key: Kestrel__Endpoints__Https__Certificate__Password
              optional: true
        - name: Messaging__Password
          valueFrom:
            secretKeyRef:
              name: vanarsdel-inventory-api-secrets
              key: Messaging__Password
              optional: true
        - name: Serilog__WriteTo__1__Args__apiKey
          valueFrom:
            secretKeyRef:
              name: vanarsdel-inventory-api-secrets
              key: Serilog__WriteTo__1__Args__apiKey
              optional: true
        - name: ServiceIdentity__ClientSecret
          valueFrom:
            secretKeyRef:
              name: vanarsdel-inventory-api-secrets
              key: ServiceIdentity__ClientSecret
              optional: true
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          privileged: false
          seccompProfile:
            type: RuntimeDefault
          appArmorProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            memory: 512Mi
            ephemeral-storage: 1Gi
        volumeMounts:
        - name: w0-dataprotection-keys
          mountPath: /home/app/.aspnet/DataProtection-Keys
          readOnly: true
        - name: w1-tmp
          mountPath: /tmp
        - name: secret-files
          mountPath: /secrets
          readOnly: true
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
          initialDelaySeconds: 20
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 30
      volumes:
      - name: w0-dataprotection-keys
        secret:
          secretName: vanarsdel-inventory-api-dataprotection
      - name: w1-tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: secret-files
        secret:
          secretName: vanarsdel-inventory-api-files
          optional: true
          defaultMode: 288
      enableServiceLinks: false
      serviceAccountName: vanarsdel-inventory-api
---
apiVersion: v1
kind: Service
metadata:
  name: vanarsdel-inventory-api
  labels:
    app.kubernetes.io/name: vanarsdel-inventory-api
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
spec:
  selector:
    app.kubernetes.io/name: vanarsdel-inventory-api
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
  ports:
  - name: http
    port: 80
    targetPort: http
---
