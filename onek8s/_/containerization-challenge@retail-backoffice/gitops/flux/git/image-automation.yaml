# registry read credential (.dockerconfigjson): every key of remote secret containerization-challenge-retail-backoffice--cz-registry in the secret store, never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: containerization-challenge-retail-backoffice-registry
  namespace: containerization-challenge-retail-backoffice
  labels:
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
    app.kubernetes.io/managed-by: containerizer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: containerization-challenge-retail-backoffice-registry
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      mergePolicy: Merge
  dataFrom:
  - extract:
      key: containerization-challenge-retail-backoffice--cz-registry
---
apiVersion: image.toolkit.fluxcd.io/v1
