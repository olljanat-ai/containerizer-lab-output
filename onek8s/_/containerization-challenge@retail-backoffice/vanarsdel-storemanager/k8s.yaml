apiVersion: v1
kind: ServiceAccount
metadata:
  name: vanarsdel-storemanager
  labels:
    app.kubernetes.io/name: vanarsdel-storemanager
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanarsdel-storemanager
  labels:
    app.kubernetes.io/name: vanarsdel-storemanager
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: vanarsdel-storemanager
      app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vanarsdel-storemanager
        app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1654
        runAsGroup: 1654
      automountServiceAccountToken: false
      containers:
      - name: vanarsdel-storemanager
        image: localhost:5000/sandbox/containerization-challenge-retail-backoffice/vanarsdel-storemanager:1.20261104.1641
        imagePullPolicy: IfNotPresent
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: ASPNETCORE_HTTP_PORTS
          value: '8080'
        - name: DOTNET_ENVIRONMENT
          value: Production
        - name: DOTNET_ROLL_FORWARD
          value: Major
        - name: Serilog__WriteTo__0__Name
          value: Console
        - name: Serilog__WriteTo__1__Args__apiKey
          valueFrom:
            secretKeyRef:
              name: vanarsdel-storemanager-secrets
              key: Serilog__WriteTo__1__Args__apiKey
              optional: true
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          privileged: false
          seccompProfile:
            type: RuntimeDefault
          appArmorProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            memory: 512Mi
            ephemeral-storage: 1Gi
        volumeMounts:
        - name: w0-logs
          mountPath: /app/logs
        - name: w1-wwwroot
          mountPath: /app/wwwroot
        - name: w2-dataprotection-keys
          mountPath: /home/app/.aspnet/DataProtection-Keys
        - name: w3-tmp
          mountPath: /tmp
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          initialDelaySeconds: 20
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 30
      volumes:
      - name: w0-logs
        emptyDir:
          sizeLimit: 256Mi
      - name: w1-wwwroot
        emptyDir:
          sizeLimit: 256Mi
      - name: w2-dataprotection-keys
        emptyDir:
          sizeLimit: 256Mi
      - name: w3-tmp
        emptyDir:
          sizeLimit: 256Mi
      enableServiceLinks: false
      serviceAccountName: vanarsdel-storemanager
---
apiVersion: v1
kind: Service
metadata:
  name: vanarsdel-storemanager
  labels:
    app.kubernetes.io/name: vanarsdel-storemanager
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
spec:
  selector:
    app.kubernetes.io/name: vanarsdel-storemanager
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vanarsdel-storemanager
  labels:
    app.kubernetes.io/name: vanarsdel-storemanager
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
  annotations:
    containerizer.io/egress: seq,configured-ports
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vanarsdel-storemanager
      app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - port: 8080
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
        - 169.254.170.2/32
        - 100.100.100.200/32
    - ipBlock:
        cidr: ::/0
        except:
        - fd00:ec2::254/128
    - namespaceSelector: {}
    ports:
    - port: 5341
      protocol: TCP
    - port: 443
      protocol: TCP
---
# values come from the secret store (ClusterSecretStore app-secrets, remote key containerization-challenge-retail-backoffice--vanarsdel-storemanager); never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vanarsdel-storemanager-secrets
  labels:
    app.kubernetes.io/name: vanarsdel-storemanager
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: vanarsdel-storemanager-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: Serilog__WriteTo__1__Args__apiKey
    remoteRef:
      key: containerization-challenge-retail-backoffice--vanarsdel-storemanager
      property: Serilog__WriteTo__1__Args__apiKey
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vanarsdel-storemanager
  labels:
    app.kubernetes.io/name: vanarsdel-storemanager
    app.kubernetes.io/part-of: containerization-challenge-retail-backoffice
  annotations:
    containerizer.io/url: https://vanarsdel-storemanager-containerization-challenge-reta-184cba0d.sandbox.lab/
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
spec:
  tls:
  - hosts:
    - vanarsdel-storemanager-containerization-challenge-reta-184cba0d.sandbox.lab
  rules:
  - host: vanarsdel-storemanager-containerization-challenge-reta-184cba0d.sandbox.lab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vanarsdel-storemanager
            port:
              name: http
