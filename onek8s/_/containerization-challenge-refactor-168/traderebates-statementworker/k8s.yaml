apiVersion: v1
kind: ServiceAccount
metadata:
  name: traderebates-statementworker
  labels:
    app.kubernetes.io/name: traderebates-statementworker
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates-refactor-168
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: traderebates-statementworker
  labels:
    app.kubernetes.io/name: traderebates-statementworker
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates-refactor-168
spec:
  schedule: 0 2 * * *
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: traderebates-statementworker
            app.kubernetes.io/part-of: containerization-challenge-trade-rebates-refactor-168
        spec:
          securityContext:
            runAsNonRoot: true
            fsGroup: 1654
            seccompProfile:
              type: RuntimeDefault
            fsGroupChangePolicy: OnRootMismatch
            runAsUser: 1654
            runAsGroup: 1654
          automountServiceAccountToken: false
          containers:
          - name: traderebates-statementworker
            image: localhost:5000/sandbox/containerization-challenge-trade-rebates-refactor-168/traderebates-statementworker:1.20261104.956-refactor.168
            imagePullPolicy: IfNotPresent
            env:
            - name: ConnectionStrings__TradeRebates
              valueFrom:
                secretKeyRef:
                  name: lab-sqlserver
                  key: connection-string
            - name: DOTNET_ENVIRONMENT
              value: Production
            - name: DOTNET_ROLL_FORWARD
              value: Major
            - name: Statements__Root
              value: /data/statements
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
              privileged: false
              seccompProfile:
                type: RuntimeDefault
              appArmorProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 64Mi
              limits:
                memory: 512Mi
                ephemeral-storage: 1Gi
            volumeMounts:
            - name: w0-statements
              mountPath: /data/statements
            - name: w1-tmp
              mountPath: /tmp
          volumes:
          - name: w0-statements
            emptyDir:
              sizeLimit: 256Mi
          - name: w1-tmp
            emptyDir:
              sizeLimit: 256Mi
          restartPolicy: OnFailure
          enableServiceLinks: false
          serviceAccountName: traderebates-statementworker
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traderebates-statementworker
  labels:
    app.kubernetes.io/name: traderebates-statementworker
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates-refactor-168
  annotations:
    containerizer.io/egress: sql-server,lab-sqlserver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traderebates-statementworker
      app.kubernetes.io/part-of: containerization-challenge-trade-rebates-refactor-168
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-trade-rebates-refactor-168
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-trade-rebates-refactor-168
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
        - 169.254.170.2/32
        - 100.100.100.200/32
    - ipBlock:
        cidr: ::/0
        except:
        - fd00:ec2::254/128
    - namespaceSelector: {}
    ports:
    - port: 1433
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: containerizer-lab
      podSelector:
        matchLabels:
          containerizer.io/lab-service: sqlserver
    ports:
    - port: 1433
      protocol: TCP
---
# values come from the secret store (ClusterSecretStore app-secrets, remote key containerization-challenge-trade-rebates-refactor-168--traderebates-statementworker); never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: traderebates-statementworker-secrets
  labels:
    app.kubernetes.io/name: traderebates-statementworker
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates-refactor-168
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: traderebates-statementworker-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: ConnectionStrings__TradeRebates
    remoteRef:
      key: containerization-challenge-trade-rebates-refactor-168--traderebates-statementworker
      property: ConnectionStrings__TradeRebates
