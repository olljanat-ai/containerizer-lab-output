# Component furnacerecords-worker, from the shared chart charts/containerizer-app (values below override its values.yaml)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: furnacerecords-worker
  labels:
    app.kubernetes.io/name: furnacerecords-worker
    app.kubernetes.io/part-of: containerization-challenge-furnace-records
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/containerizer-app
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: containerization-challenge-furnace-records
  serviceAccountName: containerization-challenge-furnace-records-reconciler
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: localhost:5000/sandbox/containerization-challenge-furnace-records/furnacerecords-worker
      tag: 1.20261107.200 # {"$imagepolicy": "containerization-challenge-furnace-records:furnacerecords-worker:tag"}
    env:
    - name: ConnectionStrings__FurnaceRecords
      valueFrom:
        secretKeyRef:
          name: lab-sqlserver
          key: connection-string
    - name: DOTNET_ENVIRONMENT
      value: Production
    - name: DOTNET_ROLL_FORWARD
      value: Major
    - name: Worker__CertificateFolder
      value: /data/certificates
    volumes:
    - name: w0-certificates
      mountPath: /data/certificates
      emptyDir:
        sizeLimit: 256Mi
    - name: w1-tmp
      mountPath: /tmp
      emptyDir:
        sizeLimit: 256Mi
    networkPolicy:
      annotations:
        containerizer.io/egress: sql-server,smtp,http-apis,lab-sqlserver
      egress:
        publicPorts:
        - port: 1433
          protocol: TCP
        - port: 25
          protocol: TCP
        - port: 465
          protocol: TCP
        - port: 587
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
        lab:
        - service: sqlserver
          port: 1433
    externalSecrets:
    - name: secrets
      keys:
      - ConnectionStrings__FurnaceRecords
