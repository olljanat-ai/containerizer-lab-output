# holds the secret values; only cluster admins and the per-namespace readers' Roles touch it
apiVersion: v1
kind: Namespace
metadata:
  name: containerizer-secrets
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: no-workloads
  namespace: containerizer-secrets
spec:
  hard:
    pods: '0'
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: app-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: containerizer-secrets
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: containerizer-secrets
      auth:
        serviceAccount:
          name: app-secrets-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-secrets-reader-containerization-challenge-furnace-records
  namespace: containerizer-secrets
  labels:
    app.kubernetes.io/part-of: containerization-challenge-furnace-records
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - containerization-challenge-furnace-records--cz-cosign-pub
  - containerization-challenge-furnace-records--cz-git
  - containerization-challenge-furnace-records--cz-lab-sqlserver
  - containerization-challenge-furnace-records--cz-registry
  - containerization-challenge-furnace-records--furnacerecords-api
  - containerization-challenge-furnace-records--furnacerecords-portal
  - containerization-challenge-furnace-records--furnacerecords-worker
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-secrets-reader-containerization-challenge-furnace-records
  namespace: containerizer-secrets
  labels:
    app.kubernetes.io/part-of: containerization-challenge-furnace-records
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-secrets-reader-containerization-challenge-furnace-records
subjects:
- kind: ServiceAccount
  name: app-secrets-reader
  namespace: containerization-challenge-furnace-records
