# Component furnacerecords-api, from the shared chart charts/containerizer-app (values below override its values.yaml)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: furnacerecords-api
  labels:
    app.kubernetes.io/name: furnacerecords-api
    app.kubernetes.io/part-of: containerization-challenge-furnace-records
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/containerizer-app
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: containerization-challenge-furnace-records
  serviceAccountName: containerization-challenge-furnace-records-reconciler
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: localhost:5000/sandbox/containerization-challenge-furnace-records/furnacerecords-api
      tag: 1.20261107.200 # {"$imagepolicy": "containerization-challenge-furnace-records:furnacerecords-api:tag"}
    env:
    - name: ConnectionStrings__FurnaceRecords
      valueFrom:
        secretKeyRef:
          name: lab-sqlserver
          key: connection-string
    - name: ASPNETCORE_ENVIRONMENT
      value: Production
    - name: ASPNETCORE_HTTP_PORTS
      value: '8080'
    - name: DOTNET_ENVIRONMENT
      value: Production
    - name: DOTNET_ROLL_FORWARD
      value: Major
    port: 8080
    volumes:
    - name: w0-dataprotection-keys
      mountPath: /home/app/.aspnet/DataProtection-Keys
      readOnly: true
      secret:
        secretName: furnacerecords-api-dataprotection
    - name: w1-tmp
      mountPath: /tmp
      emptyDir:
        sizeLimit: 256Mi
    ingress:
      enabled: true
      host: furnacerecords-api-containerization-challenge-furnace-records.sandbox.lab
    networkPolicy:
      annotations:
        containerizer.io/egress: sql-server,lab-sqlserver
      egress:
        publicPorts:
        - port: 1433
          protocol: TCP
        lab:
        - service: sqlserver
          port: 1433
    dataProtection:
      enabled: true
      keyId: 60f24f76-46cf-54ad-b7d8-9151e2672a30
    externalSecrets:
    - name: secrets
      keys:
      - ConnectionStrings__FurnaceRecords
