apiVersion: v1
kind: ServiceAccount
metadata:
  name: furnacerecords-portal
  labels:
    app.kubernetes.io/name: furnacerecords-portal
    app.kubernetes.io/part-of: containerization-challenge-furnace-records
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: furnacerecords-portal
  labels:
    app.kubernetes.io/name: furnacerecords-portal
    app.kubernetes.io/part-of: containerization-challenge-furnace-records
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: furnacerecords-portal
      app.kubernetes.io/part-of: containerization-challenge-furnace-records
  template:
    metadata:
      labels:
        app.kubernetes.io/name: furnacerecords-portal
        app.kubernetes.io/part-of: containerization-challenge-furnace-records
      annotations:
        containerizer.io/exceptions: kerberos-keytab
        containerizer.io/exception.kerberos-keytab: Windows authentication on Linux
          needs the service keytab (from a Secret, never the image) and a writable
          credential cache.
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1654
        runAsGroup: 1654
      automountServiceAccountToken: false
      containers:
      - name: furnacerecords-portal
        image: localhost:5000/sandbox/containerization-challenge-furnace-records/furnacerecords-portal:1.20261104.1641
        imagePullPolicy: IfNotPresent
        env:
        - name: ConnectionStrings__FurnaceRecords
          valueFrom:
            secretKeyRef:
              name: lab-sqlserver
              key: connection-string
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: ASPNETCORE_HTTP_PORTS
          value: '8080'
        - name: DOTNET_ENVIRONMENT
          value: Production
        - name: DOTNET_ROLL_FORWARD
          value: Major
        - name: KRB5_KTNAME
          value: /etc/krb5/keytab/service.keytab
        - name: KRB5CCNAME
          value: FILE:/tmp/krb5cc_app
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          privileged: false
          seccompProfile:
            type: RuntimeDefault
          appArmorProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            memory: 512Mi
            ephemeral-storage: 1Gi
        volumeMounts:
        - name: w0-dataprotection-keys
          mountPath: /home/app/.aspnet/DataProtection-Keys
        - name: w1-tmp
          mountPath: /tmp
        - name: x-keytab
          mountPath: /etc/krb5/keytab
          readOnly: true
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
          initialDelaySeconds: 20
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 30
      volumes:
      - name: w0-dataprotection-keys
        emptyDir:
          sizeLimit: 256Mi
      - name: w1-tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: x-keytab
        secret:
          secretName: furnacerecords-portal-keytab
          optional: true
          defaultMode: 288
      enableServiceLinks: false
      serviceAccountName: furnacerecords-portal
---
apiVersion: v1
kind: Service
metadata:
  name: furnacerecords-portal
  labels:
    app.kubernetes.io/name: furnacerecords-portal
    app.kubernetes.io/part-of: containerization-challenge-furnace-records
spec:
  selector:
    app.kubernetes.io/name: furnacerecords-portal
    app.kubernetes.io/part-of: containerization-challenge-furnace-records
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: furnacerecords-portal
  labels:
    app.kubernetes.io/name: furnacerecords-portal
    app.kubernetes.io/part-of: containerization-challenge-furnace-records
  annotations:
    containerizer.io/egress: sql-server,active-directory,configured-ports,lab-sqlserver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: furnacerecords-portal
      app.kubernetes.io/part-of: containerization-challenge-furnace-records
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - port: 8080
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-furnace-records
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-furnace-records
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
        - 169.254.170.2/32
        - 100.100.100.200/32
    - ipBlock:
        cidr: ::/0
        except:
        - fd00:ec2::254/128
    - namespaceSelector: {}
    ports:
    - port: 1433
      protocol: TCP
    - port: 88
      protocol: TCP
    - port: 88
      protocol: UDP
    - port: 389
      protocol: TCP
    - port: 636
      protocol: TCP
    - port: 464
      protocol: TCP
    - port: 3268
      protocol: TCP
    - port: 3269
      protocol: TCP
    - port: 5200
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: containerizer-lab
      podSelector:
        matchLabels:
          containerizer.io/lab-service: sqlserver
    ports:
    - port: 1433
      protocol: TCP
---
# values come from the secret store (ClusterSecretStore app-secrets, remote key containerization-challenge-furnace-records--furnacerecords-portal); never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: furnacerecords-portal-keytab
  labels:
    app.kubernetes.io/name: furnacerecords-portal
    app.kubernetes.io/part-of: containerization-challenge-furnace-records
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: furnacerecords-portal-keytab
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: service.keytab
    remoteRef:
      key: containerization-challenge-furnace-records--furnacerecords-portal
      property: service.keytab
---
# values come from the secret store (ClusterSecretStore app-secrets, remote key containerization-challenge-furnace-records--furnacerecords-portal); never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: furnacerecords-portal-secrets
  labels:
    app.kubernetes.io/name: furnacerecords-portal
    app.kubernetes.io/part-of: containerization-challenge-furnace-records
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: furnacerecords-portal-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: ConnectionStrings__FurnaceRecords
    remoteRef:
      key: containerization-challenge-furnace-records--furnacerecords-portal
      property: ConnectionStrings__FurnaceRecords
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: furnacerecords-portal
  labels:
    app.kubernetes.io/name: furnacerecords-portal
    app.kubernetes.io/part-of: containerization-challenge-furnace-records
  annotations:
    containerizer.io/url: https://furnacerecords-portal-containerization-challenge-furna-15eda163.sandbox.lab/
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
spec:
  tls:
  - hosts:
    - furnacerecords-portal-containerization-challenge-furna-15eda163.sandbox.lab
  rules:
  - host: furnacerecords-portal-containerization-challenge-furna-15eda163.sandbox.lab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: furnacerecords-portal
            port:
              name: http
