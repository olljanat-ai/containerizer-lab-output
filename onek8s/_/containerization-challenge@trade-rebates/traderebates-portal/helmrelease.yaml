# Component traderebates-portal, from the shared chart charts/containerizer-app (values below override its values.yaml)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traderebates-portal
  labels:
    app.kubernetes.io/name: traderebates-portal
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/containerizer-app
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: containerization-challenge-trade-rebates
  serviceAccountName: containerization-challenge-trade-rebates-reconciler
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: localhost:5000/sandbox/containerization-challenge-trade-rebates/traderebates-portal
      tag: 1.20261105.1046-refactor.198 # {"$imagepolicy": "containerization-challenge-trade-rebates:traderebates-portal:tag"}
    podAnnotations:
      containerizer.io/exceptions: kerberos-keytab,file-uploads
      containerizer.io/exception.kerberos-keytab: Windows authentication on Linux needs the service keytab (from a Secret,
        never the image) and a writable credential cache.
      containerizer.io/exception.file-uploads: ASP.NET Core buffers uploads larger than 64 KB to temporary files.
    resources:
      limits:
        ephemeral-storage: 2Gi
    env:
    - name: ConnectionStrings__TradeRebates
      valueFrom:
        secretKeyRef:
          name: lab-sqlserver
          key: connection-string
    - name: ASPNETCORE_ENVIRONMENT
      value: Production
    - name: ASPNETCORE_HTTP_PORTS
      value: '8080'
    - name: DOTNET_ENVIRONMENT
      value: Production
    - name: DOTNET_ROLL_FORWARD
      value: Major
    - name: KRB5_KTNAME
      value: /etc/krb5/keytab/service.keytab
    - name: KRB5CCNAME
      value: FILE:/tmp/krb5cc_app
    port: 8080
    probe:
      type: tcpSocket
    volumes:
    - name: w0-dataprotection-keys
      mountPath: /home/app/.aspnet/DataProtection-Keys
      readOnly: true
      secret:
        secretName: traderebates-portal-dataprotection
    - name: w1-tmp
      mountPath: /tmp
      emptyDir:
        sizeLimit: 1Gi
    - name: x-keytab
      mountPath: /etc/krb5/keytab
      readOnly: true
      secret:
        secretName: traderebates-portal-keytab
        optional: true
        defaultMode: 288
    ingress:
      enabled: true
      host: traderebates-portal-containerization-challenge-trade-rebates.sandbox.lab
    networkPolicy:
      annotations:
        containerizer.io/egress: sql-server,active-directory,lab-sqlserver
      egress:
        publicPorts:
        - port: 1433
          protocol: TCP
        - port: 88
          protocol: TCP
        - port: 88
          protocol: UDP
        - port: 389
          protocol: TCP
        - port: 636
          protocol: TCP
        - port: 464
          protocol: TCP
        - port: 3268
          protocol: TCP
        - port: 3269
          protocol: TCP
        lab:
        - service: sqlserver
          port: 1433
    dataProtection:
      enabled: true
      keyId: 878cfde4-f28a-57e8-9ea2-52b4ac06e388
    externalSecrets:
    - name: keytab
      keys:
      - service.keytab
    - name: secrets
      keys:
      - ConnectionStrings__TradeRebates
