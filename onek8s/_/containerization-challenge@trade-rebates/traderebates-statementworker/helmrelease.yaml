# Component traderebates-statementworker, from the shared chart charts/containerizer-app (values below override its values.yaml)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traderebates-statementworker
  labels:
    app.kubernetes.io/name: traderebates-statementworker
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/containerizer-app
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: containerization-challenge-trade-rebates
  serviceAccountName: containerization-challenge-trade-rebates-reconciler
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: localhost:5000/sandbox/containerization-challenge-trade-rebates/traderebates-statementworker
      tag: 1.20261105.1046-refactor.198 # {"$imagepolicy": "containerization-challenge-trade-rebates:traderebates-statementworker:tag"}
    kind: CronJob
    cronJob:
      schedule: 0 2 * * *
    env:
    - name: ConnectionStrings__TradeRebates
      valueFrom:
        secretKeyRef:
          name: lab-sqlserver
          key: connection-string
    - name: DOTNET_ENVIRONMENT
      value: Production
    - name: DOTNET_ROLL_FORWARD
      value: Major
    - name: Statements__Root
      value: /data/statements
    volumes:
    - name: w0-statements
      mountPath: /data/statements
      emptyDir:
        sizeLimit: 256Mi
    - name: w1-tmp
      mountPath: /tmp
      emptyDir:
        sizeLimit: 256Mi
    networkPolicy:
      annotations:
        containerizer.io/egress: sql-server,lab-sqlserver
      egress:
        publicPorts:
        - port: 1433
          protocol: TCP
        lab:
        - service: sqlserver
          port: 1433
    externalSecrets:
    - name: secrets
      keys:
      - ConnectionStrings__TradeRebates
