# Component traderebates-api, from the shared chart charts/containerizer-app (values below override its values.yaml)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traderebates-api
  labels:
    app.kubernetes.io/name: traderebates-api
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/containerizer-app
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: containerization-challenge-trade-rebates
  serviceAccountName: containerization-challenge-trade-rebates-reconciler
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: localhost:5000/sandbox/containerization-challenge-trade-rebates/traderebates-api
      tag: 1.20261105.1046-refactor.198 # {"$imagepolicy": "containerization-challenge-trade-rebates:traderebates-api:tag"}
    env:
    - name: ConnectionStrings__TradeRebates
      valueFrom:
        secretKeyRef:
          name: lab-sqlserver
          key: connection-string
    - name: ASPNETCORE_ENVIRONMENT
      value: Production
    - name: ASPNETCORE_HTTP_PORTS
      value: '8080'
    - name: DOTNET_ENVIRONMENT
      value: Production
    - name: DOTNET_ROLL_FORWARD
      value: Major
    port: 8080
    probe:
      type: httpGet
      path: /ping
    volumes:
    - name: w0-dataprotection-keys
      mountPath: /home/app/.aspnet/DataProtection-Keys
      readOnly: true
      secret:
        secretName: traderebates-api-dataprotection
    - name: w1-tmp
      mountPath: /tmp
      emptyDir:
        sizeLimit: 256Mi
    ingress:
      enabled: true
      host: traderebates-api-containerization-challenge-trade-rebates.sandbox.lab
    networkPolicy:
      annotations:
        containerizer.io/egress: sql-server,lab-sqlserver
      egress:
        publicPorts:
        - port: 1433
          protocol: TCP
        lab:
        - service: sqlserver
          port: 1433
    dataProtection:
      enabled: true
      keyId: 3afb6eea-1242-5b5b-a5c6-48ad660fa860
    externalSecrets:
    - name: secrets
      keys:
      - ConnectionStrings__TradeRebates
