  target:
    name: traderebates-api-dataprotection
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        key-3afb6eea-1242-5b5b-a5c6-48ad660fa860.xml: "<?xml version=\"1.0\" encoding=\"\
          utf-8\"?>\n<key id=\"3afb6eea-1242-5b5b-a5c6-48ad660fa860\" version=\"1\"\
          >\n  <creationDate>2026-01-01T00:00:00Z</creationDate>\n  <activationDate>2026-01-01T00:00:00Z</activationDate>\n\
          \  <expirationDate>2126-01-01T00:00:00Z</expirationDate>\n  <descriptor\
          \ deserializerType=\"Microsoft.AspNetCore.DataProtection.AuthenticatedEncryption.ConfigurationModel.AuthenticatedEncryptorDescriptorDeserializer,\
          \ Microsoft.AspNetCore.DataProtection\">\n    <descriptor>\n      <encryption\
          \ algorithm=\"AES_256_CBC\" />\n      <validation algorithm=\"HMACSHA256\"\
          \ />\n      <masterKey p4:requiresEncryption=\"true\" xmlns:p4=\"http://schemas.asp.net/2015/03/dataProtection\"\
          >\n        <value>{{ .password | b64enc }}</value>\n      </masterKey>\n\
          \    </descriptor>\n  </descriptor>\n</key>\n"
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: traderebates-api-dataprotection
---
# values come from the secret store (ClusterSecretStore app-secrets, remote key containerization-challenge-trade-rebates--traderebates-api); never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: traderebates-api-secrets
  labels:
    app.kubernetes.io/name: traderebates-api
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: traderebates-api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: ConnectionStrings__TradeRebates
    remoteRef:
      key: containerization-challenge-trade-rebates--traderebates-api
      property: ConnectionStrings__TradeRebates
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traderebates-api
  labels:
    app.kubernetes.io/name: traderebates-api
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates
  annotations:
    containerizer.io/url: https://traderebates-api-containerization-challenge-trade-rebates.sandbox.lab/
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
spec:
  tls:
  - hosts:
    - traderebates-api-containerization-challenge-trade-rebates.sandbox.lab
  rules:
  - host: traderebates-api-containerization-challenge-trade-rebates.sandbox.lab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: traderebates-api
            port:
              name: http
