apiVersion: v1
kind: ServiceAccount
metadata:
  name: traderebates-api
  labels:
    app.kubernetes.io/name: traderebates-api
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traderebates-api
  labels:
    app.kubernetes.io/name: traderebates-api
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: traderebates-api
      app.kubernetes.io/part-of: containerization-challenge-trade-rebates
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traderebates-api
        app.kubernetes.io/part-of: containerization-challenge-trade-rebates
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1654
        runAsGroup: 1654
      automountServiceAccountToken: false
      containers:
      - name: traderebates-api
        image: localhost:5000/sandbox/containerization-challenge-trade-rebates/traderebates-api:1.20261104.1641
        imagePullPolicy: IfNotPresent
        env:
        - name: ConnectionStrings__TradeRebates
          valueFrom:
            secretKeyRef:
              name: lab-sqlserver
              key: connection-string
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: ASPNETCORE_HTTP_PORTS
          value: '8080'
        - name: DOTNET_ENVIRONMENT
          value: Production
        - name: DOTNET_ROLL_FORWARD
          value: Major
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          privileged: false
          seccompProfile:
            type: RuntimeDefault
          appArmorProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            memory: 512Mi
            ephemeral-storage: 1Gi
        volumeMounts:
        - name: w0-dataprotection-keys
          mountPath: /home/app/.aspnet/DataProtection-Keys
        - name: w1-tmp
          mountPath: /tmp
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ping
            port: http
          periodSeconds: 20
          initialDelaySeconds: 20
        startupProbe:
          httpGet:
            path: /ping
            port: http
          periodSeconds: 5
          failureThreshold: 30
      volumes:
      - name: w0-dataprotection-keys
        emptyDir:
          sizeLimit: 256Mi
      - name: w1-tmp
        emptyDir:
          sizeLimit: 256Mi
      enableServiceLinks: false
      serviceAccountName: traderebates-api
---
apiVersion: v1
kind: Service
metadata:
  name: traderebates-api
  labels:
    app.kubernetes.io/name: traderebates-api
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates
spec:
  selector:
    app.kubernetes.io/name: traderebates-api
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traderebates-api
  labels:
    app.kubernetes.io/name: traderebates-api
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates
  annotations:
    containerizer.io/egress: sql-server,lab-sqlserver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traderebates-api
      app.kubernetes.io/part-of: containerization-challenge-trade-rebates
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - port: 8080
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-trade-rebates
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-trade-rebates
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
        - 169.254.170.2/32
        - 100.100.100.200/32
    - ipBlock:
        cidr: ::/0
        except:
        - fd00:ec2::254/128
    - namespaceSelector: {}
    ports:
    - port: 1433
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: containerizer-lab
      podSelector:
        matchLabels:
          containerizer.io/lab-service: sqlserver
    ports:
    - port: 1433
      protocol: TCP
---
# values come from the secret store (ClusterSecretStore app-secrets, remote key containerization-challenge-trade-rebates--traderebates-api); never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: traderebates-api-secrets
  labels:
    app.kubernetes.io/name: traderebates-api
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: traderebates-api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: ConnectionStrings__TradeRebates
    remoteRef:
      key: containerization-challenge-trade-rebates--traderebates-api
      property: ConnectionStrings__TradeRebates
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traderebates-api
  labels:
    app.kubernetes.io/name: traderebates-api
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates
  annotations:
    containerizer.io/url: https://traderebates-api-containerization-challenge-trade-rebates.sandbox.lab/
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
spec:
  tls:
  - hosts:
    - traderebates-api-containerization-challenge-trade-rebates.sandbox.lab
  rules:
  - host: traderebates-api-containerization-challenge-trade-rebates.sandbox.lab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: traderebates-api
            port:
              name: http
