# Component partscatalog, from the shared chart charts/containerizer-app (values below override its values.yaml)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: partscatalog
  labels:
    app.kubernetes.io/name: partscatalog
    app.kubernetes.io/part-of: containerization-challenge-parts-catalog
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/containerizer-app
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: containerization-challenge-parts-catalog
  serviceAccountName: containerization-challenge-parts-catalog-reconciler
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: localhost:5000/sandbox/containerization-challenge-parts-catalog-refactor-191/partscatalog
      tag: 1.20261104.2052-refactor.191 # {"$imagepolicy": "containerization-challenge-parts-catalog:partscatalog:tag"}
    env:
    - name: ConnectionStrings__Catalog
      valueFrom:
        secretKeyRef:
          name: lab-sqlserver
          key: connection-string
    - name: ASPNETCORE_ENVIRONMENT
      value: Production
    - name: ASPNETCORE_HTTP_PORTS
      value: '8080'
    - name: DOTNET_ENVIRONMENT
      value: Production
    - name: DOTNET_ROLL_FORWARD
      value: Major
    port: 8080
    probe:
      type: httpGet
      path: /ping
    volumes:
    - name: w0-app-data
      mountPath: /app/App_Data
      emptyDir:
        sizeLimit: 256Mi
    - name: w1-logs
      mountPath: /app/logs
      emptyDir:
        sizeLimit: 256Mi
    - name: w2-dataprotection-keys
      mountPath: /home/app/.aspnet/DataProtection-Keys
      readOnly: true
      secret:
        secretName: partscatalog-dataprotection
    - name: w3-tmp
      mountPath: /tmp
      emptyDir:
        sizeLimit: 256Mi
    ingress:
      enabled: true
      host: partscatalog-containerization-challenge-parts-catalog.sandbox.lab
    networkPolicy:
      annotations:
        containerizer.io/egress: sql-server,lab-sqlserver
      egress:
        publicPorts:
        - port: 1433
          protocol: TCP
        lab:
        - service: sqlserver
          port: 1433
    dataProtection:
      enabled: true
      keyId: ba014e86-e315-58f6-bdb3-a98a8da9cff0
    externalSecrets:
    - name: secrets
      keys:
      - ConnectionStrings__Catalog
