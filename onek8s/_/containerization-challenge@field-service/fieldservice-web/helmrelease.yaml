# Component fieldservice-web, from the shared chart charts/containerizer-app (values below override its values.yaml)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fieldservice-web
  labels:
    app.kubernetes.io/name: fieldservice-web
    app.kubernetes.io/part-of: containerization-challenge-field-service
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/containerizer-app
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: containerization-challenge-field-service
  serviceAccountName: containerization-challenge-field-service-reconciler
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: localhost:5000/sandbox/containerization-challenge-field-service-refactor-192/fieldservice-web
      tag: 1.20261104.2110-refactor.192 # {"$imagepolicy": "containerization-challenge-field-service:fieldservice-web:tag"}
    podAnnotations:
      containerizer.io/exceptions: file-uploads
      containerizer.io/exception.file-uploads: ASP.NET Core buffers uploads larger than 64 KB to temporary files.
    resources:
      limits:
        ephemeral-storage: 2Gi
    env:
    - name: ConnectionStrings__FieldService
      valueFrom:
        secretKeyRef:
          name: lab-sqlserver
          key: connection-string
    - name: ASPNETCORE_ENVIRONMENT
      value: Production
    - name: ASPNETCORE_HTTP_PORTS
      value: '8080'
    - name: DOTNET_ENVIRONMENT
      value: Production
    - name: DOTNET_ROLL_FORWARD
      value: Major
    port: 8080
    probe:
      type: tcpSocket
    volumes:
    - name: w0-dataprotection-keys
      mountPath: /home/app/.aspnet/DataProtection-Keys
      readOnly: true
      secret:
        secretName: fieldservice-web-dataprotection
    - name: w1-tmp
      mountPath: /tmp
      emptyDir:
        sizeLimit: 1Gi
    ingress:
      enabled: true
      host: fieldservice-web-containerization-challenge-field-service.sandbox.lab
    networkPolicy:
      annotations:
        containerizer.io/egress: sql-server,redis,lab-sqlserver
      egress:
        publicPorts:
        - port: 1433
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 6380
          protocol: TCP
        lab:
        - service: sqlserver
          port: 1433
    dataProtection:
      enabled: true
      keyId: aff54069-5c4f-568b-920a-03ac8cc326c6
    externalSecrets:
    - name: secrets
      keys:
      - ConnectionStrings__FieldService
