# registry read credential (.dockerconfigjson): every key of remote secret containerization-challenge-parts-catalog-refactor-175--cz-registry in the secret store, never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: containerization-challenge-parts-catalog-refactor-175-registry
  namespace: containerization-challenge-parts-catalog-refactor-175
  labels:
    app.kubernetes.io/part-of: containerization-challenge-parts-catalog-refactor-175
    app.kubernetes.io/managed-by: containerizer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: containerization-challenge-parts-catalog-refactor-175-registry
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      mergePolicy: Merge
  dataFrom:
  - extract:
      key: containerization-challenge-parts-catalog-refactor-175--cz-registry
---
# cosign public key (cosign.pub): every key of remote secret containerization-challenge-parts-catalog-refactor-175--cz-cosign-pub in the secret store, never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: containerization-challenge-parts-catalog-refactor-175-cosign-pub
  namespace: containerization-challenge-parts-catalog-refactor-175
  labels:
    app.kubernetes.io/part-of: containerization-challenge-parts-catalog-refactor-175
    app.kubernetes.io/managed-by: containerizer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: containerization-challenge-parts-catalog-refactor-175-cosign-pub
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: containerization-challenge-parts-catalog-refactor-175--cz-cosign-pub
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: containerization-challenge-parts-catalog-refactor-175
  namespace: containerization-challenge-parts-catalog-refactor-175
  labels:
    app.kubernetes.io/part-of: containerization-challenge-parts-catalog-refactor-175
    app.kubernetes.io/managed-by: containerizer
spec:
  interval: 5m
  url: oci://localhost:5000/sandbox/containerization-challenge-parts-catalog-refactor-175/manifests
  ref:
    semver: '>=1.0.0'
  secretRef:
    name: containerization-challenge-parts-catalog-refactor-175-registry
  verify:
    provider: cosign
    secretRef:
      name: containerization-challenge-parts-catalog-refactor-175-cosign-pub
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: containerization-challenge-parts-catalog-refactor-175
  namespace: containerization-challenge-parts-catalog-refactor-175
  labels:
    app.kubernetes.io/part-of: containerization-challenge-parts-catalog-refactor-175
    app.kubernetes.io/managed-by: containerizer
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: OCIRepository
    name: containerization-challenge-parts-catalog-refactor-175
  path: ./
  prune: true
  wait: true
  targetNamespace: containerization-challenge-parts-catalog-refactor-175
  serviceAccountName: containerization-challenge-parts-catalog-refactor-175-reconciler
  patches:
  - patch: "$patch: delete\napiVersion: v1\nkind: Namespace\nmetadata:\n  name: containerization-challenge-parts-catalog-refactor-175\n"
    target:
      kind: Namespace
      name: containerization-challenge-parts-catalog-refactor-175
  - patch: "$patch: delete\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\n\
      metadata:\n  name: default-deny-all\n"
    target:
      kind: NetworkPolicy
      name: default-deny-all
  - patch: "$patch: delete\napiVersion: v1\nkind: LimitRange\nmetadata:\n  name: defaults\n"
    target:
      kind: LimitRange
      name: defaults
  - patch: "$patch: delete\napiVersion: v1\nkind: ResourceQuota\nmetadata:\n  name:\
      \ quota\n"
    target:
      kind: ResourceQuota
      name: quota
  - patch: "$patch: delete\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name:\
      \ app-secrets-reader\n"
    target:
      kind: ServiceAccount
      name: app-secrets-reader
  force: false
