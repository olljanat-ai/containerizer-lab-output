apiVersion: v1
kind: ServiceAccount
metadata:
  name: humongous-documents
  labels:
    app.kubernetes.io/name: humongous-documents
    app.kubernetes.io/part-of: containerization-challenge-broker-quotes
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: humongous-documents
  labels:
    app.kubernetes.io/name: humongous-documents
    app.kubernetes.io/part-of: containerization-challenge-broker-quotes
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: humongous-documents
      app.kubernetes.io/part-of: containerization-challenge-broker-quotes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: humongous-documents
        app.kubernetes.io/part-of: containerization-challenge-broker-quotes
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1654
        runAsGroup: 1654
      automountServiceAccountToken: false
      containers:
      - name: humongous-documents
        image: localhost:5000/sandbox/containerization-challenge-broker-quotes/humongous-documents:1.20261105.1524
        imagePullPolicy: IfNotPresent
        env:
        - name: ConnectionStrings__Quoting
          valueFrom:
            secretKeyRef:
              name: lab-sqlserver
              key: connection-string
        - name: DOTNET_ENVIRONMENT
          value: Production
        - name: DOTNET_ROLL_FORWARD
          value: Major
        - name: Serilog__WriteTo__0__Name
          value: Console
        - name: Bus__Password
          valueFrom:
            secretKeyRef:
              name: humongous-documents-secrets
              key: Bus__Password
              optional: true
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          privileged: false
          seccompProfile:
            type: RuntimeDefault
          appArmorProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            memory: 512Mi
            ephemeral-storage: 1Gi
        volumeMounts:
        - name: w0-logs
          mountPath: /app/logs
        - name: w1-tmp
          mountPath: /tmp
      volumes:
      - name: w0-logs
        emptyDir:
          sizeLimit: 256Mi
      - name: w1-tmp
        emptyDir:
          sizeLimit: 256Mi
      enableServiceLinks: false
      serviceAccountName: humongous-documents
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: humongous-documents
  labels:
    app.kubernetes.io/name: humongous-documents
    app.kubernetes.io/part-of: containerization-challenge-broker-quotes
  annotations:
    containerizer.io/egress: sql-server,rabbitmq,smtp,http-apis,lab-sqlserver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: humongous-documents
      app.kubernetes.io/part-of: containerization-challenge-broker-quotes
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-broker-quotes
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-broker-quotes
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
        - 169.254.170.2/32
        - 100.100.100.200/32
    - ipBlock:
        cidr: ::/0
        except:
        - fd00:ec2::254/128
    - namespaceSelector: {}
    ports:
    - port: 1433
      protocol: TCP
    - port: 5671
      protocol: TCP
    - port: 5672
      protocol: TCP
    - port: 25
      protocol: TCP
    - port: 465
      protocol: TCP
    - port: 587
      protocol: TCP
    - port: 443
      protocol: TCP
    - port: 80
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: containerizer-lab
      podSelector:
        matchLabels:
          containerizer.io/lab-service: sqlserver
    ports:
    - port: 1433
      protocol: TCP
---
# values come from the secret store (ClusterSecretStore app-secrets, remote key containerization-challenge-broker-quotes--humongous-documents); never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: humongous-documents-secrets
  labels:
    app.kubernetes.io/name: humongous-documents
    app.kubernetes.io/part-of: containerization-challenge-broker-quotes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: humongous-documents-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: ConnectionStrings__Quoting
    remoteRef:
      key: containerization-challenge-broker-quotes--humongous-documents
      property: ConnectionStrings__Quoting
  - secretKey: Bus__Password
    remoteRef:
      key: containerization-challenge-broker-quotes--humongous-documents
      property: Bus__Password
