# Component humongous-documents, from the shared chart charts/containerizer-app (values below override its values.yaml)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: humongous-documents
  labels:
    app.kubernetes.io/name: humongous-documents
    app.kubernetes.io/part-of: containerization-challenge-broker-quotes
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/containerizer-app
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: containerization-challenge-broker-quotes
  serviceAccountName: containerization-challenge-broker-quotes-reconciler
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: localhost:5000/sandbox/containerization-challenge-broker-quotes/humongous-documents
      tag: 1.20261107.200 # {"$imagepolicy": "containerization-challenge-broker-quotes:humongous-documents:tag"}
    env:
    - name: ConnectionStrings__Quoting
      valueFrom:
        secretKeyRef:
          name: lab-sqlserver
          key: connection-string
    - name: DOTNET_ENVIRONMENT
      value: Production
    - name: DOTNET_ROLL_FORWARD
      value: Major
    - name: Serilog__WriteTo__0__Name
      value: Console
    - name: Bus__Password
      valueFrom:
        secretKeyRef:
          name: humongous-documents-secrets
          key: Bus__Password
          optional: true
    volumes:
    - name: w0-logs
      mountPath: /app/logs
      emptyDir:
        sizeLimit: 256Mi
    - name: w1-tmp
      mountPath: /tmp
      emptyDir:
        sizeLimit: 256Mi
    networkPolicy:
      annotations:
        containerizer.io/egress: sql-server,rabbitmq,smtp,http-apis,lab-sqlserver,lab-rabbitmq
      egress:
        publicPorts:
        - port: 1433
          protocol: TCP
        - port: 5671
          protocol: TCP
        - port: 5672
          protocol: TCP
        - port: 25
          protocol: TCP
        - port: 465
          protocol: TCP
        - port: 587
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
        lab:
        - service: sqlserver
          port: 1433
        - service: rabbitmq
          port: 5672
    externalSecrets:
    - name: secrets
      keys:
      - ConnectionStrings__Quoting
      - Bus__Password
