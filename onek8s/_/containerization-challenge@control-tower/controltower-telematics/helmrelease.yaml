# Component controltower-telematics, from the shared chart charts/containerizer-app (values below override its values.yaml)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: controltower-telematics
  labels:
    app.kubernetes.io/name: controltower-telematics
    app.kubernetes.io/part-of: containerization-challenge-control-tower
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/containerizer-app
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: containerization-challenge-control-tower
  serviceAccountName: containerization-challenge-control-tower-reconciler
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: localhost:5000/sandbox/containerization-challenge-control-tower/controltower-telematics
      tag: 1.20261107.200 # {"$imagepolicy": "containerization-challenge-control-tower:controltower-telematics:tag"}
    env:
    - name: ConnectionStrings__RabbitMq
      valueFrom:
        secretKeyRef:
          name: lab-rabbitmq
          key: connection-string
    - name: ConnectionStrings__ControlTower
      valueFrom:
        secretKeyRef:
          name: lab-sqlserver
          key: connection-string
    - name: CONTROLTOWER_LOG_DIR
      value: /app/logs
    - name: DOTNET_ENVIRONMENT
      value: Production
    - name: Telematics__Password
      valueFrom:
        secretKeyRef:
          name: controltower-telematics-secrets
          key: Telematics__Password
          optional: true
    volumes:
    - name: w0-logs
      mountPath: /app/logs
      emptyDir:
        sizeLimit: 256Mi
    - name: w1-telematics
      mountPath: /app/proseware/telematics
      emptyDir:
        sizeLimit: 256Mi
    - name: w2-tmp
      mountPath: /tmp
      emptyDir:
        sizeLimit: 256Mi
    networkPolicy:
      annotations:
        containerizer.io/egress: sql-server,rabbitmq,sftp,http-apis,lab-sqlserver,lab-rabbitmq,lab-sftp
      egress:
        publicPorts:
        - port: 1433
          protocol: TCP
        - port: 5671
          protocol: TCP
        - port: 5672
          protocol: TCP
        - port: 22
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
        lab:
        - service: sqlserver
          port: 1433
        - service: rabbitmq
          port: 5672
        - service: sftp
          port: 2022
          perApp: true
    externalSecrets:
    - name: secrets
      keys:
      - ConnectionStrings__ControlTower
      - ConnectionStrings__RabbitMq
      - Telematics__Password
