apiVersion: v1
kind: ServiceAccount
metadata:
  name: controltower-carriergateway
  labels:
    app.kubernetes.io/name: controltower-carriergateway
    app.kubernetes.io/part-of: containerization-challenge-control-tower
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controltower-carriergateway
  labels:
    app.kubernetes.io/name: controltower-carriergateway
    app.kubernetes.io/part-of: containerization-challenge-control-tower
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: controltower-carriergateway
      app.kubernetes.io/part-of: containerization-challenge-control-tower
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controltower-carriergateway
        app.kubernetes.io/part-of: containerization-challenge-control-tower
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1654
        runAsGroup: 1654
      automountServiceAccountToken: false
      containers:
      - name: controltower-carriergateway
        image: localhost:5000/sandbox/containerization-challenge-control-tower/controltower-carriergateway:1.20261114.200
        imagePullPolicy: IfNotPresent
        env:
        - name: Carriers__Sftp__NRDL__Host
          valueFrom:
            secretKeyRef:
              name: lab-sftp
              key: host
        - name: Carriers__Sftp__NRDL__Port
          valueFrom:
            secretKeyRef:
              name: lab-sftp
              key: port
        - name: Carriers__Sftp__NRDL__UserName
          valueFrom:
            secretKeyRef:
              name: lab-sftp
              key: username
        - name: Carriers__Sftp__NSFL__Host
          valueFrom:
            secretKeyRef:
              name: lab-sftp
              key: host
        - name: Carriers__Sftp__NSFL__Password
          valueFrom:
            secretKeyRef:
              name: lab-sftp
              key: password
        - name: Carriers__Sftp__NSFL__UserName
          valueFrom:
            secretKeyRef:
              name: lab-sftp
              key: username
        - name: Carriers__Sftp__OCNX__Host
          valueFrom:
            secretKeyRef:
              name: lab-sftp
              key: host
        - name: Carriers__Sftp__OCNX__UserName
          valueFrom:
            secretKeyRef:
              name: lab-sftp
              key: username
        - name: Carriers__Sftp__VNRL__Host
          valueFrom:
            secretKeyRef:
              name: lab-sftp
              key: host
        - name: Carriers__Sftp__VNRL__Password
          valueFrom:
            secretKeyRef:
              name: lab-sftp
              key: password
        - name: Carriers__Sftp__VNRL__Port
          valueFrom:
            secretKeyRef:
              name: lab-sftp
              key: port
        - name: Carriers__Sftp__VNRL__UserName
          valueFrom:
            secretKeyRef:
              name: lab-sftp
              key: username
        - name: ConnectionStrings__RabbitMq
          valueFrom:
            secretKeyRef:
              name: lab-rabbitmq
              key: connection-string
        - name: ConnectionStrings__ControlTower
          valueFrom:
            secretKeyRef:
              name: lab-sqlserver
              key: connection-string
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: ASPNETCORE_HTTP_PORTS
          value: '8080'
        - name: ASPNETCORE_URLS
          value: http://+:8080
        - name: CONTROLTOWER_LOG_DIR
          value: /app/logs
        - name: Carriers__Sftp__NRDL__PrivateKeyFile
          value: /secrets/nrdl_rsa.pem
        - name: Carriers__Sftp__OCNX__PrivateKeyFile
          value: /secrets/ocnx_rsa.pem
        - name: DOTNET_ENVIRONMENT
          value: Production
        - name: Gateway__WebhookUrls
          value: http://+:8080
        - name: Gateway__WorkFolder
          value: /data/controltower/edi
        - name: Carriers__Api__AFX__ClientSecret
          valueFrom:
            secretKeyRef:
              name: controltower-carriergateway-secrets
              key: Carriers__Api__AFX__ClientSecret
              optional: true
        - name: Carriers__Api__BALX__ApiKey
          valueFrom:
            secretKeyRef:
              name: controltower-carriergateway-secrets
              key: Carriers__Api__BALX__ApiKey
              optional: true
        - name: Carriers__Api__PRCL__ApiKey
          valueFrom:
            secretKeyRef:
              name: controltower-carriergateway-secrets
              key: Carriers__Api__PRCL__ApiKey
              optional: true
        - name: Carriers__Api__PRCL__WebhookSecret
          valueFrom:
            secretKeyRef:
              name: controltower-carriergateway-secrets
              key: Carriers__Api__PRCL__WebhookSecret
              optional: true
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          privileged: false
          seccompProfile:
            type: RuntimeDefault
          appArmorProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            memory: 512Mi
            ephemeral-storage: 1Gi
        volumeMounts:
        - name: w0-logs
          mountPath: /app/logs
        - name: w1-edi
          mountPath: /data/controltower/edi
        - name: w2-dataprotection-keys
          mountPath: /home/app/.aspnet/DataProtection-Keys
          readOnly: true
        - name: w3-tmp
          mountPath: /tmp
        - name: secret-files
          mountPath: /secrets
          readOnly: true
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          initialDelaySeconds: 20
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 30
      volumes:
      - name: w0-logs
        emptyDir:
          sizeLimit: 256Mi
      - name: w1-edi
        emptyDir:
          sizeLimit: 256Mi
      - name: w2-dataprotection-keys
        secret:
          secretName: controltower-carriergateway-dataprotection
      - name: w3-tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: secret-files
        secret:
          secretName: controltower-carriergateway-files
          optional: true
          defaultMode: 288
      enableServiceLinks: false
      serviceAccountName: controltower-carriergateway
---
