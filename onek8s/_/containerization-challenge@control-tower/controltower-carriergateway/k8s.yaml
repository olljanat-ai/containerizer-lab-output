apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controltower-carriergateway
  labels:
    app.kubernetes.io/name: controltower-carriergateway
    app.kubernetes.io/part-of: containerization-challenge-control-tower
  annotations:
    containerizer.io/egress: sql-server,rabbitmq,sftp,http-apis,lab-sqlserver,lab-rabbitmq,lab-sftp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: controltower-carriergateway
      app.kubernetes.io/part-of: containerization-challenge-control-tower
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - port: 8080
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-control-tower
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-control-tower
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
        - 169.254.170.2/32
        - 100.100.100.200/32
    - ipBlock:
        cidr: ::/0
        except:
        - fd00:ec2::254/128
    - namespaceSelector: {}
    ports:
    - port: 1433
      protocol: TCP
    - port: 5671
      protocol: TCP
    - port: 5672
      protocol: TCP
    - port: 22
      protocol: TCP
    - port: 443
      protocol: TCP
    - port: 80
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: containerizer-lab
      podSelector:
        matchLabels:
          containerizer.io/lab-service: sqlserver
    ports:
    - port: 1433
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: containerizer-lab
      podSelector:
        matchLabels:
          containerizer.io/lab-service: rabbitmq
    ports:
    - port: 5672
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: containerizer-lab
      podSelector:
        matchLabels:
          containerizer.io/lab-service: sftp
          containerizer.io/lab-app: containerization-challenge-control-tower
    ports:
    - port: 2022
      protocol: TCP
---
