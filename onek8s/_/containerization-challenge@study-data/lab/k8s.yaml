  002-02-logins.sql: 'IF DATABASE_PRINCIPAL_ID(N''studydata_app'') IS NULL CREATE
    ROLE [studydata_app];

    GRANT SELECT, INSERT, UPDATE, DELETE ON SCHEMA::[edc] TO [studydata_app];

    -- The audit trail is append-only for the applications.

    DENY UPDATE, DELETE ON [edc].[Audit] TO [studydata_app];

    GO

    IF DATABASE_PRINCIPAL_ID(N''$(Domain)\svc-studydata-web'') IS NULL CREATE USER
    [$(Domain)\svc-studydata-web] FOR LOGIN [$(Domain)\svc-studydata-web] WITH DEFAULT_SCHEMA
    = [edc];

    IF DATABASE_PRINCIPAL_ID(N''$(Domain)\svc-studydata-job$'') IS NULL CREATE USER
    [$(Domain)\svc-studydata-job$] FOR LOGIN [$(Domain)\svc-studydata-job$] WITH DEFAULT_SCHEMA
    = [edc];

    ALTER ROLE [studydata_app] ADD MEMBER [$(Domain)\svc-studydata-web];

    ALTER ROLE [studydata_app] ADD MEMBER [$(Domain)\svc-studydata-job$];

    GO

    '
  003-03-audit-protection.sql: "CREATE OR ALTER TRIGGER [edc].[TR_Audit_Immutable]\
    \ ON [edc].[Audit]\nINSTEAD OF UPDATE, DELETE\nAS\nBEGIN\n    SET NOCOUNT ON;\n\
    \    THROW 51000, N'Audit trail entries cannot be changed or deleted.', 1;\nEND\n\
    GO\n"
