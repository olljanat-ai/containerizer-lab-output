apiVersion: v1
kind: ServiceAccount
metadata:
  name: fieldservice-worker
  labels:
    app.kubernetes.io/name: fieldservice-worker
    app.kubernetes.io/part-of: containerization-challenge-field-service-refactor-192
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fieldservice-worker
  labels:
    app.kubernetes.io/name: fieldservice-worker
    app.kubernetes.io/part-of: containerization-challenge-field-service-refactor-192
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: fieldservice-worker
      app.kubernetes.io/part-of: containerization-challenge-field-service-refactor-192
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fieldservice-worker
        app.kubernetes.io/part-of: containerization-challenge-field-service-refactor-192
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1654
        runAsGroup: 1654
      automountServiceAccountToken: false
      containers:
      - name: fieldservice-worker
        image: localhost:5000/sandbox/containerization-challenge-field-service-refactor-192/fieldservice-worker:1.20261104.2110-refactor.192
        imagePullPolicy: IfNotPresent
        env:
        - name: ConnectionStrings__FieldService
          valueFrom:
            secretKeyRef:
              name: lab-sqlserver
              key: connection-string
        - name: DOTNET_ENVIRONMENT
          value: Production
        - name: DOTNET_ROLL_FORWARD
          value: Major
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          privileged: false
          seccompProfile:
            type: RuntimeDefault
          appArmorProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            memory: 512Mi
            ephemeral-storage: 1Gi
        volumeMounts:
        - name: w0-tmp
          mountPath: /tmp
      volumes:
      - name: w0-tmp
        emptyDir:
          sizeLimit: 256Mi
      enableServiceLinks: false
      serviceAccountName: fieldservice-worker
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fieldservice-worker
  labels:
    app.kubernetes.io/name: fieldservice-worker
    app.kubernetes.io/part-of: containerization-challenge-field-service-refactor-192
  annotations:
    containerizer.io/egress: sql-server,lab-sqlserver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fieldservice-worker
      app.kubernetes.io/part-of: containerization-challenge-field-service-refactor-192
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-field-service-refactor-192
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-field-service-refactor-192
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
        - 169.254.170.2/32
        - 100.100.100.200/32
    - ipBlock:
        cidr: ::/0
        except:
        - fd00:ec2::254/128
    - namespaceSelector: {}
    ports:
    - port: 1433
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: containerizer-lab
      podSelector:
        matchLabels:
          containerizer.io/lab-service: sqlserver
    ports:
    - port: 1433
      protocol: TCP
---
# values come from the secret store (ClusterSecretStore app-secrets, remote key containerization-challenge-field-service-refactor-192--fieldservice-worker); never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fieldservice-worker-secrets
  labels:
    app.kubernetes.io/name: fieldservice-worker
    app.kubernetes.io/part-of: containerization-challenge-field-service-refactor-192
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: fieldservice-worker-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: ConnectionStrings__FieldService
    remoteRef:
      key: containerization-challenge-field-service-refactor-192--fieldservice-worker
      property: ConnectionStrings__FieldService
