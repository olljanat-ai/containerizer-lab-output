# Component lucerne-lending-documents, from the shared chart charts/containerizer-app (values below override its values.yaml)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lucerne-lending-documents
  labels:
    app.kubernetes.io/name: lucerne-lending-documents
    app.kubernetes.io/part-of: containerization-challenge-consumer-loans
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/containerizer-app
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: containerization-challenge-consumer-loans
  serviceAccountName: containerization-challenge-consumer-loans-reconciler
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: localhost:5000/sandbox/containerization-challenge-consumer-loans/lucerne-lending-documents
      tag: 1.20261107.200 # {"$imagepolicy": "containerization-challenge-consumer-loans:lucerne-lending-documents:tag"}
    env:
    - name: ConnectionStrings__Lending
      valueFrom:
        secretKeyRef:
          name: lab-sqlserver
          key: connection-string
    - name: DOTNET_ENVIRONMENT
      value: Production
    - name: NLog__variables__logDir
      value: /data/logs/consumerloans/documents
    volumes:
    - name: w0-logs
      mountPath: /app/logs
      emptyDir:
        sizeLimit: 256Mi
    - name: w1-documents
      mountPath: /data/logs/consumerloans/documents
      emptyDir:
        sizeLimit: 256Mi
    - name: w2-tmp
      mountPath: /tmp
      emptyDir:
        sizeLimit: 256Mi
    networkPolicy:
      annotations:
        containerizer.io/egress: sql-server,smtp,http-apis,lab-sqlserver
      egress:
        publicPorts:
        - port: 1433
          protocol: TCP
        - port: 25
          protocol: TCP
        - port: 465
          protocol: TCP
        - port: 587
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
        lab:
        - service: sqlserver
          port: 1433
    externalSecrets:
    - name: secrets
      keys:
      - ConnectionStrings__Lending
