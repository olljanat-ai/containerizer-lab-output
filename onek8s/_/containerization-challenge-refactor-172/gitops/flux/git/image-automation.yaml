# registry read credential (.dockerconfigjson): every key of remote secret containerization-challenge-trade-rebates-refactor-172--cz-registry in the secret store, never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: containerization-challenge-trade-rebates-refactor-172-registry
  namespace: containerization-challenge-trade-rebates-refactor-172
  labels:
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates-refactor-172
    app.kubernetes.io/managed-by: containerizer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: containerization-challenge-trade-rebates-refactor-172-registry
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      mergePolicy: Merge
  dataFrom:
  - extract:
      key: containerization-challenge-trade-rebates-refactor-172--cz-registry
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: traderebates-api
  namespace: containerization-challenge-trade-rebates-refactor-172
  labels:
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates-refactor-172
    app.kubernetes.io/managed-by: containerizer
spec:
  image: localhost:5000/sandbox/containerization-challenge-trade-rebates-refactor-172/traderebates-api
  interval: 10m
  secretRef:
    name: containerization-challenge-trade-rebates-refactor-172-registry
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: traderebates-api
  namespace: containerization-challenge-trade-rebates-refactor-172
  labels:
    app.kubernetes.io/part-of: containerization-challenge-trade-rebates-refactor-172
    app.kubernetes.io/managed-by: containerizer
spec:
  imageRepositoryRef:
