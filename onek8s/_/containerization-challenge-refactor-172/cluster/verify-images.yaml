# Kyverno: only cosign-signed images from the application registry run in the namespace; replace the key with your signing identity (or use keyless attestors)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-images-containerization-challenge-trade-rebates-refactor-172
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  background: false
  rules:
  - name: signed-images
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - containerization-challenge-trade-rebates-refactor-172
    verifyImages:
    - imageReferences:
      - localhost:5000/sandbox/containerization-challenge-trade-rebates-refactor-172/*
      mutateDigest: true
      verifyDigest: true
      required: true
      attestors:
      - entries:
        - keys:
            publicKeys: '-----BEGIN PUBLIC KEY-----

              <cosign.pub>

              -----END PUBLIC KEY-----'
