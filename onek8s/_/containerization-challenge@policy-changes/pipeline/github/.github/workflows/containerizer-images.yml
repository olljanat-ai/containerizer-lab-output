# Container image build pipeline for containerization-challenge-policy-changes, generated by containerizer (GitHub Actions).
# Pull/merge requests: build, SBOM (Syft) and vulnerability scan (Trivy), nothing is pushed.
# Default branch: the same, then push <registry>/containerization-challenge-policy-changes/<component> tagged 1.<yyyymmdd>.<hhmm>
# (UTC; the GitOps image automation follows these semver tags) and sha-<commit>.
# Setup and the secrets it needs: containerizer/README.md (https://containerizer.eu/build-pipelines/).
name: containerizer images (containerization-challenge-policy-changes)
'on':
  pull_request:
    paths:
    - scenarios/policy-changes/Directory.Build.props
    - scenarios/policy-changes/containerizer/policychanges-api/**
    - scenarios/policy-changes/global.json
    - scenarios/policy-changes/src/PolicyChanges.Api/**
    - scenarios/policy-changes/src/PolicyChanges.Core/**
    - scenarios/policy-changes/src/PolicyChanges.Data/**
    - .github/workflows/containerizer-images.yml
  push:
    branches:
    - main
    paths:
    - scenarios/policy-changes/Directory.Build.props
    - scenarios/policy-changes/containerizer/policychanges-api/**
    - scenarios/policy-changes/global.json
    - scenarios/policy-changes/src/PolicyChanges.Api/**
    - scenarios/policy-changes/src/PolicyChanges.Core/**
    - scenarios/policy-changes/src/PolicyChanges.Data/**
    - .github/workflows/containerizer-images.yml
  workflow_dispatch: null
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Components to build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      components: ${{ steps.pick.outputs.components }}
      version: ${{ steps.pick.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: pick
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        case "$EVENT" in
          pull_request) BASE="$PR_BASE" ;;
          push) BASE="$BEFORE" ;;
          *) BASE="" ;;
        esac
        ALL=1
        CHANGED=""
        if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          if ! printf '%s\n' "$CHANGED" | grep -qxF ".github/workflows/containerizer-images.yml"; then ALL=0; fi
        fi
        changed() { [ "$ALL" = 1 ] || printf '%s\n' "$CHANGED" | grep -qE "$1"; }
        list=""
        if changed '^(scenarios/policy-changes/src/PolicyChanges\.Api/|scenarios/policy-changes/src/PolicyChanges\.Core/|scenarios/policy-changes/src/PolicyChanges\.Data/|scenarios/policy-changes/Directory\.Build\.props$|scenarios/policy-changes/global\.json$|scenarios/policy-changes/containerizer/policychanges-api/)'; then list="$list${list:+,}{\"folder\":\"policychanges-api\",\"dockerfile\":\"scenarios/policy-changes/containerizer/policychanges-api/Dockerfile\",\"context\":\"scenarios/policy-changes\",\"image_name\":\"containerization-challenge-policy-changes/policychanges-api\"}"; fi
        echo "components=[$list]" >> "$GITHUB_OUTPUT"
        echo "version=1.$(date -u +%Y%m%d).$(date -u +%H%M | sed 's/^0*\(.\)/\1/')" >> "$GITHUB_OUTPUT"
        echo "components to build: [$list]"
  check:
    name: Build and scan ${{ matrix.folder }}
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.components) }}
    env:
      FOLDER: ${{ matrix.folder }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      CONTEXT: ${{ matrix.context }}
      COMMIT_SHA: ${{ github.sha }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      TRIVY_SEVERITY: ${{ vars.CONTAINERIZER_TRIVY_SEVERITY || 'CRITICAL' }}
      TRIVY_IGNORE_UNFIXED: ${{ vars.CONTAINERIZER_TRIVY_IGNORE_UNFIXED || 'true' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build, SBOM and vulnerability scan
      run: |
        set -eu
        docker build --pull -f "$DOCKERFILE" -t "cz-local/$FOLDER:ci" \
          --label "org.opencontainers.image.revision=$COMMIT_SHA" \
          --label "org.opencontainers.image.source=$SOURCE_URL" \
          "$CONTEXT"
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.33.0@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357 \
          scan "docker:cz-local/$FOLDER:ci" -q -o cyclonedx-json > "sbom-$FOLDER.cdx.json"
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -e TRIVY_SEVERITY -e TRIVY_IGNORE_UNFIXED -e TRIVY_EXIT_CODE=1 -e TRIVY_NO_PROGRESS=true -e TRIVY_SKIP_VERSION_CHECK=true \
          -e TRIVY_SCANNERS=vuln aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 image "cz-local/$FOLDER:ci"
    - name: SBOM
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom-${{ matrix.folder }}
        path: sbom-${{ matrix.folder }}.cdx.json
        if-no-files-found: ignore
  publish:
    name: Build, scan and push ${{ matrix.folder }}
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.components != '[]' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.components) }}
    env:
      FOLDER: ${{ matrix.folder }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      CONTEXT: ${{ matrix.context }}
      COMMIT_SHA: ${{ github.sha }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      TRIVY_SEVERITY: ${{ vars.CONTAINERIZER_TRIVY_SEVERITY || 'CRITICAL' }}
      TRIVY_IGNORE_UNFIXED: ${{ vars.CONTAINERIZER_TRIVY_IGNORE_UNFIXED || 'true' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build, SBOM and vulnerability scan
      run: |
        set -eu
        docker build --pull -f "$DOCKERFILE" -t "cz-local/$FOLDER:ci" \
          --label "org.opencontainers.image.revision=$COMMIT_SHA" \
          --label "org.opencontainers.image.source=$SOURCE_URL" \
          "$CONTEXT"
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.33.0@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357 \
          scan "docker:cz-local/$FOLDER:ci" -q -o cyclonedx-json > "sbom-$FOLDER.cdx.json"
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -e TRIVY_SEVERITY -e TRIVY_IGNORE_UNFIXED -e TRIVY_EXIT_CODE=1 -e TRIVY_NO_PROGRESS=true -e TRIVY_SKIP_VERSION_CHECK=true \
          -e TRIVY_SCANNERS=vuln aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 image "cz-local/$FOLDER:ci"
    - name: SBOM
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom-${{ matrix.folder }}
        path: sbom-${{ matrix.folder }}.cdx.json
        if-no-files-found: ignore
    - name: Log in to the registry
      env:
        CONTAINERIZER_REGISTRY: ${{ vars.CONTAINERIZER_REGISTRY }}
        REGISTRY_USERNAME: ${{ secrets.CONTAINERIZER_REGISTRY_USERNAME }}
        REGISTRY_PASSWORD: ${{ secrets.CONTAINERIZER_REGISTRY_PASSWORD }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -eu
        OWNER=$(printf %s "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
        REGISTRY="${CONTAINERIZER_REGISTRY:-ghcr.io/$OWNER}"
        HOST="${REGISTRY%%/*}"
        if [ -n "${REGISTRY_USERNAME:-}" ]; then
          printf %s "$REGISTRY_PASSWORD" | docker login "$HOST" -u "$REGISTRY_USERNAME" --password-stdin
        elif [ "$HOST" = ghcr.io ]; then
          printf %s "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        else
          echo "::error::$HOST needs the CONTAINERIZER_REGISTRY_USERNAME and CONTAINERIZER_REGISTRY_PASSWORD secrets"
          exit 1
        fi
        echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
    - name: Push
      env:
        IMAGE_NAME: ${{ matrix.image_name }}
        VERSION: ${{ needs.changes.outputs.version }}
        CONTAINERIZER_PUSH_LATEST: ${{ vars.CONTAINERIZER_PUSH_LATEST || 'false' }}
      run: |
        set -eu
        IMAGE="$REGISTRY/$IMAGE_NAME"
        SHORT=$(printf %s "$COMMIT_SHA" | cut -c1-12)
        TAGS="$VERSION sha-$SHORT"
        if [ "${CONTAINERIZER_PUSH_LATEST:-false}" = true ]; then TAGS="$TAGS latest"; fi
        for t in $TAGS; do
          docker tag "cz-local/$FOLDER:ci" "$IMAGE:$t"
          docker push "$IMAGE:$t" > "push-$FOLDER.log"
          cat "push-$FOLDER.log"
        done
        DIGEST=$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' "push-$FOLDER.log" | tail -n 1)
        if [ -z "$DIGEST" ]; then echo "no digest in the output of docker push" >&2; exit 1; fi
        DIGEST_REF="$IMAGE@$DIGEST"
        echo "pushed $IMAGE:$VERSION and sha-$SHORT: $DIGEST_REF"
        echo "$DIGEST_REF" > "image-$FOLDER.txt"
        echo "$DIGEST_REF" >> "$GITHUB_STEP_SUMMARY"
    - name: Log out
      if: always()
      run: docker logout "${REGISTRY%%/*}" || true
