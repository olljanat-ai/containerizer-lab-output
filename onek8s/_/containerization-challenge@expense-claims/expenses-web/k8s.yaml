apiVersion: v1
kind: ServiceAccount
metadata:
  name: expenses-web
  labels:
    app.kubernetes.io/name: expenses-web
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expenses-web
  labels:
    app.kubernetes.io/name: expenses-web
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: expenses-web
      app.kubernetes.io/part-of: containerization-challenge-expense-claims
  template:
    metadata:
      labels:
        app.kubernetes.io/name: expenses-web
        app.kubernetes.io/part-of: containerization-challenge-expense-claims
      annotations:
        containerizer.io/exceptions: nginx-writable-dirs
        containerizer.io/exception.nginx-writable-dirs: nginx keeps its pid file and
          request buffers in /tmp and its proxy cache in /var/cache/nginx.
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 101
        runAsGroup: 101
      automountServiceAccountToken: false
      containers:
      - name: expenses-web
        image: localhost:5000/sandbox/containerization-challenge-expense-claims/expenses-web:1.20261105.2123-refactor.210
        imagePullPolicy: IfNotPresent
        env: []
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          privileged: false
          seccompProfile:
            type: RuntimeDefault
          appArmorProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            memory: 512Mi
            ephemeral-storage: 1Gi
        volumeMounts:
        - name: w0-tmp
          mountPath: /tmp
        - name: x-var-cache-nginx
          mountPath: /var/cache/nginx
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
          initialDelaySeconds: 20
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 30
      volumes:
      - name: w0-tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: x-var-cache-nginx
        emptyDir:
          sizeLimit: 256Mi
      enableServiceLinks: false
      serviceAccountName: expenses-web
---
apiVersion: v1
kind: Service
metadata:
  name: expenses-web
  labels:
    app.kubernetes.io/name: expenses-web
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
spec:
  selector:
    app.kubernetes.io/name: expenses-web
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: expenses-web
  labels:
    app.kubernetes.io/name: expenses-web
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
  annotations:
    containerizer.io/egress: none
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: expenses-web
      app.kubernetes.io/part-of: containerization-challenge-expense-claims
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - port: 8080
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-expense-claims
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: containerization-challenge-expense-claims
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expenses-web
  labels:
    app.kubernetes.io/name: expenses-web
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
  annotations:
    containerizer.io/url: https://expenses-web-containerization-challenge-expense-claims.sandbox.lab/
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
spec:
  tls:
  - hosts:
    - expenses-web-containerization-challenge-expense-claims.sandbox.lab
  rules:
  - host: expenses-web-containerization-challenge-expense-claims.sandbox.lab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: expenses-web
            port:
              name: http
