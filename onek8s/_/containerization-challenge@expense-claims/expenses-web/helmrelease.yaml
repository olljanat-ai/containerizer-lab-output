# Component expenses-web, from the shared chart charts/containerizer-app (values below override its values.yaml)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: expenses-web
  labels:
    app.kubernetes.io/name: expenses-web
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/containerizer-app
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: containerization-challenge-expense-claims
  serviceAccountName: containerization-challenge-expense-claims-reconciler
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: localhost:5000/sandbox/containerization-challenge-expense-claims/expenses-web
      tag: 1.20261105.2123-refactor.210 # {"$imagepolicy": "containerization-challenge-expense-claims:expenses-web:tag"}
    podAnnotations:
      containerizer.io/exceptions: nginx-writable-dirs
      containerizer.io/exception.nginx-writable-dirs: nginx keeps its pid file and request buffers in /tmp and its proxy cache
        in /var/cache/nginx.
    podSecurityContext:
      fsGroup: 101
      runAsUser: 101
      runAsGroup: 101
    port: 8080
    probe:
      type: httpGet
      path: /healthz
    volumes:
    - name: w0-tmp
      mountPath: /tmp
      emptyDir:
        sizeLimit: 256Mi
    - name: x-var-cache-nginx
      mountPath: /var/cache/nginx
      emptyDir:
        sizeLimit: 256Mi
    ingress:
      enabled: true
      host: expenses-web-containerization-challenge-expense-claims.sandbox.lab
    networkPolicy:
      annotations:
        containerizer.io/egress: none
