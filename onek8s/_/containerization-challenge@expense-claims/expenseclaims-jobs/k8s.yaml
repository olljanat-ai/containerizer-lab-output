  labels:
    app.kubernetes.io/name: expenseclaims-jobs
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: '0'
  target:
    name: expenseclaims-jobs-dataprotection
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        key-0c64e217-c5c4-598d-ac22-b5fe0ddd67cd.xml: "<?xml version=\"1.0\" encoding=\"\
          utf-8\"?>\n<key id=\"0c64e217-c5c4-598d-ac22-b5fe0ddd67cd\" version=\"1\"\
          >\n  <creationDate>2026-01-01T00:00:00Z</creationDate>\n  <activationDate>2026-01-01T00:00:00Z</activationDate>\n\
          \  <expirationDate>2126-01-01T00:00:00Z</expirationDate>\n  <descriptor\
          \ deserializerType=\"Microsoft.AspNetCore.DataProtection.AuthenticatedEncryption.ConfigurationModel.AuthenticatedEncryptorDescriptorDeserializer,\
          \ Microsoft.AspNetCore.DataProtection\">\n    <descriptor>\n      <encryption\
          \ algorithm=\"AES_256_CBC\" />\n      <validation algorithm=\"HMACSHA256\"\
          \ />\n      <masterKey p4:requiresEncryption=\"true\" xmlns:p4=\"http://schemas.asp.net/2015/03/dataProtection\"\
          >\n        <value>{{ .password | b64enc }}</value>\n      </masterKey>\n\
          \    </descriptor>\n  </descriptor>\n</key>\n"
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: expenseclaims-jobs-dataprotection
---
# values come from the secret store (ClusterSecretStore app-secrets, remote key containerization-challenge-expense-claims--expenseclaims-jobs); never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: expenseclaims-jobs-secrets
  labels:
    app.kubernetes.io/name: expenseclaims-jobs
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: expenseclaims-jobs-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: ConnectionStrings__ExpenseClaims
    remoteRef:
      key: containerization-challenge-expense-claims--expenseclaims-jobs
      property: ConnectionStrings__ExpenseClaims
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expenseclaims-jobs
  labels:
    app.kubernetes.io/name: expenseclaims-jobs
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
  annotations:
    containerizer.io/url: https://expenseclaims-jobs-containerization-challenge-expense-claims.sandbox.lab/
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
spec:
  tls:
  - hosts:
    - expenseclaims-jobs-containerization-challenge-expense-claims.sandbox.lab
  rules:
  - host: expenseclaims-jobs-containerization-challenge-expense-claims.sandbox.lab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: expenseclaims-jobs
            port:
              name: http
