apiVersion: v1
kind: Namespace
metadata:
  name: containerization-challenge-expense-claims
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
    app.kubernetes.io/managed-by: containerizer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: containerization-challenge-expense-claims-reconciler
  namespace: containerization-challenge-expense-claims
  labels:
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
    app.kubernetes.io/managed-by: containerizer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: containerization-challenge-expense-claims-reconciler
  namespace: containerization-challenge-expense-claims
  labels:
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
    app.kubernetes.io/managed-by: containerizer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: ServiceAccount
  name: containerization-challenge-expense-claims-reconciler
  namespace: containerization-challenge-expense-claims
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-secrets-reader
  namespace: containerization-challenge-expense-claims
  labels:
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
    app.kubernetes.io/managed-by: containerizer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-secrets-reader-containerization-challenge-expense-claims
  namespace: containerizer-secrets
  labels:
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
    app.kubernetes.io/managed-by: containerizer
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - containerization-challenge-expense-claims--cz-cosign-pub
  - containerization-challenge-expense-claims--cz-git
  - containerization-challenge-expense-claims--cz-lab-sqlserver
  - containerization-challenge-expense-claims--cz-registry
  - containerization-challenge-expense-claims--expenseclaims-api
  - containerization-challenge-expense-claims--expenseclaims-jobs
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-secrets-reader-containerization-challenge-expense-claims
  namespace: containerizer-secrets
  labels:
    app.kubernetes.io/part-of: containerization-challenge-expense-claims
    app.kubernetes.io/managed-by: containerizer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-secrets-reader-containerization-challenge-expense-claims
subjects:
- kind: ServiceAccount
  name: app-secrets-reader
  namespace: containerization-challenge-expense-claims
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: containerization-challenge-expense-claims
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: containerization-challenge-expense-claims
spec:
  limits:
  - type: Container
    default:
      memory: 512Mi
      ephemeral-storage: 1Gi
    defaultRequest:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 64Mi
    max:
      memory: 4Gi
      ephemeral-storage: 4Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: containerization-challenge-expense-claims
spec:
  hard:
    requests.cpu: 1000m
    requests.memory: 1024Mi
    limits.memory: 2048Mi
    requests.ephemeral-storage: 192Mi
    limits.ephemeral-storage: 4608Mi
    pods: '10'
    services: '10'
    persistentvolumeclaims: '10'
    secrets: '20'
    configmaps: '20'
