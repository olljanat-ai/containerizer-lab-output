# read-only deploy key or token (identity + known_hosts, or username + password): every key of remote secret containerization-challenge-city-permits--cz-git in the secret store, never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: containerization-challenge-city-permits-git
  namespace: containerization-challenge-city-permits
  labels:
    app.kubernetes.io/part-of: containerization-challenge-city-permits
    app.kubernetes.io/managed-by: containerizer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: containerization-challenge-city-permits-git
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: containerization-challenge-city-permits--cz-git
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: containerization-challenge-city-permits
  namespace: containerization-challenge-city-permits
  labels:
    app.kubernetes.io/part-of: containerization-challenge-city-permits
    app.kubernetes.io/managed-by: containerizer
spec:
  interval: 5m
  url: https://github.com/olljanat-ai/containerizer-lab-output.git
  ref:
    branch: main
  secretRef:
    name: containerization-challenge-city-permits-git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: containerization-challenge-city-permits
  namespace: containerization-challenge-city-permits
  labels:
    app.kubernetes.io/part-of: containerization-challenge-city-permits
    app.kubernetes.io/managed-by: containerizer
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: containerization-challenge-city-permits
  path: ./onek8s/_/containerization-challenge@city-permits
  prune: true
  wait: true
  targetNamespace: containerization-challenge-city-permits
  serviceAccountName: containerization-challenge-city-permits-reconciler
  patches:
  - patch: "$patch: delete\napiVersion: v1\nkind: Namespace\nmetadata:\n  name: containerization-challenge-city-permits\n"
    target:
      kind: Namespace
      name: containerization-challenge-city-permits
  - patch: "$patch: delete\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\n\
      metadata:\n  name: default-deny-all\n"
    target:
      kind: NetworkPolicy
      name: default-deny-all
  - patch: "$patch: delete\napiVersion: v1\nkind: LimitRange\nmetadata:\n  name: defaults\n"
    target:
      kind: LimitRange
      name: defaults
  - patch: "$patch: delete\napiVersion: v1\nkind: ResourceQuota\nmetadata:\n  name:\
      \ quota\n"
    target:
      kind: ResourceQuota
      name: quota
  - patch: "$patch: delete\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name:\
      \ app-secrets-reader\n"
    target:
      kind: ServiceAccount
      name: app-secrets-reader
  force: false
