# NSA/CISA 'Kubernetes native audit logging configuration'; pass with --audit-policy-file
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
- RequestReceived
rules:
- level: Metadata
  resources:
  - group: ''
    resources:
    - secrets
    - configmaps
  - group: authentication.k8s.io
    resources:
    - tokenreviews
- level: RequestResponse
  resources:
  - group: rbac.authorization.k8s.io
- level: Request
  verbs:
  - create
  - update
  - patch
  - delete
  - deletecollection
  resources:
  - group: ''
  - group: apps
  - group: batch
  - group: networking.k8s.io
  - group: policy
- level: Metadata
  verbs:
  - get
  - list
  - watch
  resources:
  - group: ''
    resources:
    - pods/exec
    - pods/attach
    - pods/portforward
- level: None
  users:
  - system:kube-proxy
  verbs:
  - watch
- level: None
  nonResourceURLs:
  - /healthz*
  - /readyz*
  - /livez*
  - /version
- level: Metadata
