# holds the secret values; only cluster admins and the per-namespace readers' Roles touch it
apiVersion: v1
kind: Namespace
metadata:
  name: containerizer-secrets
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: no-workloads
  namespace: containerizer-secrets
spec:
  hard:
    pods: '0'
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: app-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: containerizer-secrets
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: containerizer-secrets
      auth:
        serviceAccount:
          name: app-secrets-reader
