{{- $partOf := include "containerizer-app.partOf" . }}
{{- $egress := .Values.networkPolicy.egress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "containerizer-app.name" . }}
  labels:
    {{- include "containerizer-app.labels" . | nindent 4 }}
  {{- with .Values.networkPolicy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "containerizer-app.labels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  {{- if and .Values.port .Values.networkPolicy.ingressFromAllNamespaces }}
  - from:
    - namespaceSelector: {}
    ports:
    - port: {{ .Values.port }}
      protocol: TCP
  {{- end }}
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: {{ $partOf }}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: {{ $partOf }}
  {{- with $egress.publicPorts }}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
          {{- toYaml $egress.blockedCidrs.ipv4 | nindent 8 }}
    - ipBlock:
        cidr: ::/0
        except:
          {{- toYaml $egress.blockedCidrs.ipv6 | nindent 8 }}
    - namespaceSelector: {}
    ports:
    {{- range . }}
    - port: {{ .port }}
      protocol: {{ default "TCP" .protocol }}
    {{- end }}
  {{- end }}
  {{- range $egress.lab }}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $egress.labNamespace }}
      podSelector:
        matchLabels:
          {{- if .perApp }}
          containerizer.io/lab-app: {{ $partOf }}
          {{- end }}
          containerizer.io/lab-service: {{ .service }}
    ports:
    - port: {{ .port }}
      protocol: {{ default "TCP" .protocol }}
  {{- end }}
  {{- with $egress.extra }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
