{{- $name := include "containerizer-app.name" . }}
{{- $store := .Values.secretStore }}
{{- $remoteKey := default (printf "%s--%s" (include "containerizer-app.partOf" .) $name) $store.remoteKey }}
{{- range .Values.externalSecrets }}
---
# values come from the secret store ({{ $store.kind }} {{ $store.name }}, remote key {{ $remoteKey }}); never from Git
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-{{ .name }}
  labels:
    {{- include "containerizer-app.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $store.refreshInterval }}
  secretStoreRef:
    kind: {{ $store.kind }}
    name: {{ $store.name }}
  target:
    name: {{ $name }}-{{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range .keys }}
  - secretKey: {{ . | quote }}
    remoteRef:
      key: {{ $remoteKey }}
      property: {{ . | quote }}
  {{- end }}
{{- end }}
