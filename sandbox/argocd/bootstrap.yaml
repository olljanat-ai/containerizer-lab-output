apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-secrets-reader-argocd
  namespace: containerizer-secrets
  labels:
    app.kubernetes.io/part-of: containerizer-sandbox
    app.kubernetes.io/managed-by: containerizer
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - argocd--cz-git
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-secrets-reader-argocd
  namespace: containerizer-secrets
  labels:
    app.kubernetes.io/part-of: containerizer-sandbox
    app.kubernetes.io/managed-by: containerizer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-secrets-reader-argocd
subjects:
- kind: ServiceAccount
  name: app-secrets-reader
  namespace: argocd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-secrets-reader
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: containerizer-sandbox
    app.kubernetes.io/managed-by: containerizer
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: containerizer-sandbox-repo
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: containerizer-sandbox
    app.kubernetes.io/managed-by: containerizer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: containerizer-sandbox-repo
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/olljanat-ai/containerizer-lab-output.git
  dataFrom:
  - extract:
      key: argocd--cz-git
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: containerizer-sandbox
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: containerizer-sandbox
    app.kubernetes.io/managed-by: containerizer
spec:
  description: 'containerizer sandbox: creates only the per-app AppProjects and Applications'
  sourceRepos:
  - https://github.com/olljanat-ai/containerizer-lab-output.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: argoproj.io
    kind: AppProject
  - group: argoproj.io
    kind: Application
  orphanedResources:
    warn: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: containerizer-sandbox
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: containerizer-sandbox
    app.kubernetes.io/managed-by: containerizer
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: containerizer-sandbox
  source:
    repoURL: https://github.com/olljanat-ai/containerizer-lab-output.git
    targetRevision: main
    path: sandbox/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
