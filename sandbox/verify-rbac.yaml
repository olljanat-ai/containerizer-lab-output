# Read-only access for `containerizer sandbox verify`. Apply it as a
# cluster admin after the namespaces exist; it grants nothing cluster-wide and no access to Secrets.
apiVersion: v1
kind: Namespace
metadata:
  name: containerizer-verify
  labels:
    app.kubernetes.io/part-of: containerizer-sandbox
    app.kubernetes.io/managed-by: containerizer
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: containerizer-verifier
  namespace: containerizer-verify
  labels:
    app.kubernetes.io/part-of: containerizer-sandbox
    app.kubernetes.io/managed-by: containerizer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: containerizer-verifier
  namespace: containerization-challenge-batch-release
  labels:
    app.kubernetes.io/part-of: containerizer-sandbox
    app.kubernetes.io/managed-by: containerizer
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods
  - events
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - kustomize.toolkit.fluxcd.io
  resources:
  - kustomizations
  resourceNames:
  - containerization-challenge-batch-release
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: containerizer-verifier
  namespace: containerization-challenge-batch-release
  labels:
    app.kubernetes.io/part-of: containerizer-sandbox
    app.kubernetes.io/managed-by: containerizer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: containerizer-verifier
subjects:
- kind: ServiceAccount
  name: containerizer-verifier
  namespace: containerizer-verify
