apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-secrets-reader
  namespace: containerizer-idp
  labels:
    app.kubernetes.io/part-of: containerizer-sandbox
    app.kubernetes.io/managed-by: containerizer
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cz-idp
  namespace: containerizer-idp
  labels:
    app.kubernetes.io/part-of: containerizer-sandbox
    app.kubernetes.io/managed-by: containerizer
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: cz-idp
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: containerizer-idp--cz-idp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-secrets-reader-containerizer-idp
  namespace: containerizer-secrets
  labels:
    app.kubernetes.io/part-of: containerizer-sandbox
    app.kubernetes.io/managed-by: containerizer
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - containerizer-idp--cz-idp
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-secrets-reader-containerizer-idp
  namespace: containerizer-secrets
  labels:
    app.kubernetes.io/part-of: containerizer-sandbox
    app.kubernetes.io/managed-by: containerizer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-secrets-reader-containerizer-idp
subjects:
- kind: ServiceAccount
  name: app-secrets-reader
  namespace: containerizer-idp
