apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-secrets-reader-flux-system
  namespace: containerizer-secrets
  labels:
    app.kubernetes.io/part-of: containerizer-production
    app.kubernetes.io/managed-by: containerizer
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - flux-system--cz-git
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-secrets-reader-flux-system
  namespace: containerizer-secrets
  labels:
    app.kubernetes.io/part-of: containerizer-production
    app.kubernetes.io/managed-by: containerizer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-secrets-reader-flux-system
subjects:
- kind: ServiceAccount
  name: app-secrets-reader
  namespace: flux-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-secrets-reader
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: containerizer-production
    app.kubernetes.io/managed-by: containerizer
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: containerizer-production-git
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: containerizer-production
    app.kubernetes.io/managed-by: containerizer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: containerizer-production-git
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: flux-system--cz-git
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: containerizer-production
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: containerizer-production
    app.kubernetes.io/managed-by: containerizer
spec:
  interval: 5m
  url: https://github.com/olljanat-ai/containerizer-lab-output.git
  ref:
    branch: main
  secretRef:
    name: containerizer-production-git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: containerizer-production
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: containerizer-production
    app.kubernetes.io/managed-by: containerizer
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: containerizer-production
  path: ./clusters/production/flux/apps
